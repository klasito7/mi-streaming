name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          mkdir o && cd o
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
          C="curl -sL --compressed -A \"$UA\" -H 'Accept-Language: es-AR'"
          eval $C https://vueltarapida.com/assets/index-DeEJ_wfs.js -o bundle.js
          eval $C https://vueltarapida.com/legals/terminos -o terminos.html
          grep -oE '"(https?:)?//[^"]{4,120}"|`(https?:)?//[^`]{4,120}`' bundle.js | sort -u > urls.txt
          grep -oE '"/api[^"]{0,100}"|/v1/[a-zA-Z0-9_/-]{2,60}|from\("[a-z_]+"\)|\.from\(.[a-z_]+.\)' bundle.js | sort | uniq -c | sort -rn | head -150 > api.txt
          grep -oE '.{150}calendar.{150}' bundle.js | head -40 > calctx.txt
          gzip -k bundle.js
          rm bundle.js
          ls -la > ls.txt
          git init -q; git checkout -q -b probe; git add -A; git -c user.name=p -c user.email=p@p commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe

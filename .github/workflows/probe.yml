name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - shell: bash
        run: |
          set +e
          mkdir -p o
          FORCE=1 node scripts/fetch-tablas.mjs o > o/log.txt 2>&1
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          curl -s --compressed "$B/arg.1/teams/5/schedule?fixture=true" -o o/fix.json
          curl -s --compressed "$B/arg.1/scoreboard?dates=20261101-20261130" -o o/rng.json
          curl -s --compressed "https://site.api.espn.com/apis/v2/sports/soccer/arg.1/standings" -o o/std.json
          curl -s --compressed "$B/arg.1/summary?event=401841669&lang=es&region=ar" -o o/sumes.json
          cd o; gzip -f *.json; cp ../scripts/fetch-tablas.mjs . 2>/dev/null
          git init -q; git checkout -q -b probe; git add -A; git -c user.name=p -c user.email=p@p commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe

name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          mkdir o && cd o
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          C="curl -s --compressed"
          $C "$B/arg.1/summary?event=401841669" -o summary.json
          for Y in 2025 2024; do $C "$B/arg.1/teams/5/schedule?season=$Y" -o s1_$Y.json; done
          $C "$B/arg.copa_lpf/teams/5/schedule?season=2024" -o scl24.json
          $C "$B/arg.1/teams/1/schedule?season=2024" -o s_t1_24.json
          python3 - <<'PY' > summ.txt
          import json,glob
          for f in sorted(glob.glob('s*.json')):
            if f=='summary.json': continue
            try: d=json.load(open(f))
            except Exception as e: print(f,'ERR',e); continue
            ev=d.get('events',[]); from collections import Counter
            print(f, d.get('team',{}).get('displayName'), len(ev), Counter((e.get('seasonType',{}).get('name'), e.get('league',{}).get('slug')) for e in ev).most_common(8))
          PY
          gzip -kf summary.json
          rm -f summary.json s*.json
          git init -q; git checkout -q -b probe; git add -A; git -c user.name=p -c user.email=p@p commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Espiral del Templo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: juego arcade selvático, cálido y vibrante
   IDEA: un templo de piedra donde un tótem escupe bolas de jade
   PICTURE: la espiral tallada ocupa toda la pantalla, el tótem al centro
   COLOUR and TYPE: selva profunda + piedra + bolas saturadas; Cinzel Decorative + Nunito
   LAYOUT: lienzo a pantalla completa, HUD fino arriba, paneles centrados */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{-webkit-touch-callout:none;margin:0;height:100%;background:#0b110a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Nunito,system-ui,sans-serif;color:#f4ecd6}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 8px calc(env(safe-area-inset-left) + 10px);pointer-events:none;font-weight:800;font-size:15px;z-index:2}
.pill{background:rgba(20,16,8,.6);border:1px solid rgba(255,220,150,.22);border-radius:999px;padding:6px 11px;white-space:nowrap}
#sc{min-width:68px;text-align:right;font-variant-numeric:tabular-nums}
#bar{flex:1;height:10px;background:rgba(0,0,0,.5);border-radius:99px;overflow:hidden;border:1px solid rgba(255,220,150,.22)}
#barf{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff7a3d)}
#lives{color:#ff5a6a;letter-spacing:1px;white-space:nowrap}
.ib{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,220,150,.3);background:rgba(20,16,8,.65);color:#f4ecd6;font-size:16px;display:grid;place-items:center;cursor:pointer;padding:0}
.ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;touch-action:pan-y;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(30,45,25,.82),rgba(4,7,4,.94))}
.hidden{display:none!important}
h1{font-family:"Cinzel Decorative",serif;font-weight:900;font-size:clamp(34px,10vw,56px);line-height:1.05;margin:0;color:#ffd96b;text-shadow:0 3px 0 #7a4a10,0 8px 24px rgba(0,0,0,.6);text-wrap:balance}
.ov p{margin:0;max-width:340px;font-size:16px;line-height:1.5;color:#e9dfc4}
.big{font-size:40px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:10px;width:min(300px,100%)}.btns .btn{flex:1 1 100%}.btns .btn.half{flex:1 1 calc(50% - 5px);font-size:15px;min-height:44px}
.btn{min-height:50px;border-radius:14px;border:0;font:800 18px Nunito,sans-serif;cursor:pointer;color:#2a1a04;background:linear-gradient(#ffe27a,#f2a531);box-shadow:0 4px 0 #8a5410,0 10px 20px rgba(0,0,0,.4)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5410}
.btn.alt{background:linear-gradient(#5b6b4a,#3a4630);color:#f4ecd6;box-shadow:0 4px 0 #1e2618}
.btn:focus-visible,.ib:focus-visible{outline:3px solid #fff;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(330px,100%);max-height:52vh;overflow-y:auto;touch-action:pan-y;padding:4px}
.lvb{aspect-ratio:1;border-radius:14px;border:0;font:800 20px Nunito,sans-serif;color:#2a1a04;background:linear-gradient(#ffe27a,#f2a531);box-shadow:0 3px 0 #8a5410;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.lvb small{font-size:12px;letter-spacing:1px}.lvb:disabled{background:#3a4630;color:#7d8a6c;box-shadow:none;cursor:default}
.stars{font-size:46px;letter-spacing:6px;line-height:1}.stars .on{color:#ffd23f;text-shadow:0 0 18px rgba(255,210,63,.7)}.stars .off{color:rgba(255,255,255,.18)}
.skin{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:2px solid transparent;background:rgba(255,255,255,.06);color:#f4ecd6;font:800 13px Nunito,sans-serif;cursor:pointer}
.skin i{width:46px;height:46px;border-radius:50%;display:block;box-shadow:inset -6px -8px 12px rgba(0,0,0,.45)}
.skin.sel{border-color:#ffd23f}.skin:disabled{opacity:.45;cursor:default}
.bpm{display:flex;gap:6px;align-items:center;justify-content:center}
.bpm button{width:44px;height:44px;border-radius:12px;border:0;background:#3a4630;color:#f4ecd6;font:800 16px Nunito,sans-serif;cursor:pointer}
.bpm input{width:92px;height:44px;font:800 20px Nunito,sans-serif;text-align:center;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#111;color:#fff;-webkit-user-select:text;user-select:text}
.dot{width:54px;height:54px;border-radius:50%;background:#ff2bd6;box-shadow:0 0 24px #ff2bd6;margin:4px auto;will-change:transform}
.tapb{width:min(260px,100%);min-height:76px;border-radius:18px;border:2px solid #ff2bd6;background:rgba(255,43,214,.15);color:#fff;font:900 26px Nunito,sans-serif;cursor:pointer;touch-action:manipulation}
.tapb:active{background:rgba(255,43,214,.45)}
.steps{text-align:left;font-size:15px;max-width:320px;margin:0;padding-left:20px;color:#e9dfc4}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;text-align:left;font-size:14px;color:#d8cfb4;max-width:300px}
.legend span:nth-child(odd){font-size:18px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<input type="file" id="file" accept="audio/*" hidden>
<div id="hud">
  <div class="pill">Nv <b id="lv">1</b></div>
  <div class="pill" id="sc">0</div>
  <div id="bar"><i id="barf"></i></div>
  <div id="lives"></div>
  <button class="ib" id="pz" aria-label="Pausa">❚❚</button>
</div>
<div id="ov" class="ov">
  <h1 id="ovt">Espiral del Templo</h1>
  <div id="ovx"></div>
  <div class="btns" id="ovb"></div>
</div>
<script>
{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const COLORS=[['#ff5252','#9e0e1c'],['#ffd23f','#a8700a'],['#5ee36e','#17702a'],['#45adff','#123f99'],['#c675ff','#561591'],['#45f2e0','#0b7f76'],['#8a8a8a','#1c1c1c'],['#ff3b3b','#3a0000']];
const STONE=6,BOSS=7;
const THEMES=[{a:'#22163f',b:'#07040f',t:'#2a2248',t2:'#362c5c',n:'#ff2bd6'},{a:'#0f2a3a',b:'#03080d',t:'#173546',t2:'#1f4459',n:'#2bf3ff'},{a:'#1d3315',b:'#050a03',t:'#22381c',t2:'#2c4824',n:'#9dff2b'},{a:'#3a1d12',b:'#0d0503',t:'#452517',t2:'#5a311f',n:'#ffb02b'}];
// Abierto dentro de FUNVS (Jugar → Espiral): el progreso viaja en db.espiral (se sincroniza entre aparatos) y los premios van a tus vaccoins.
const host=(()=>{try{return window.parent!==window&&window.parent.EspiralHost||null}catch(e){return null}})();
const SYNCED=new Set(['best','maxLvl','stars','skin','daily']);
let hostData=(()=>{try{return host&&host.get()||{}}catch(e){return {}}})();
const store={get(k,d){if(host&&SYNCED.has(k))return hostData[k]===undefined?d:hostData[k];try{const v=localStorage.getItem('espiral_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){if(host&&SYNCED.has(k)){hostData={...hostData,[k]:v};try{host.set(hostData)}catch(e){}return}try{localStorage.setItem('espiral_'+k,JSON.stringify(v))}catch(e){}}};
function ganar(id,n,motivo){if(!host||!host.ganar)return 0;try{return host.ganar(id,n,motivo)||0}catch(e){return 0}}
if(store.get('style','hard')==='file')store.set('style','hard');
let best=store.get('best',0),maxLvl=store.get('maxLvl',1),muted=store.get('muted',false),style=store.get('style','hard'),stars=store.get('stars',{}),skin=store.get('skin','piedra');
let W,H,DPR,D,R,L=1,pts=[],cum=[],bg=null,sprites=[],cx=0,cy=0,trackPath=null;
const G={state:'menu',lvl:1,score:0,lvlStartScore:0,lives:3,balls:[],shots:[],spawned:0,total:0,ncol:4,speed:1,rush:true,cur:0,next:1,aim:-Math.PI/2,combo:0,streak:0,fx:{slow:0,rev:0,aim:0},parts:[],pops:[],shake:0,cool:0,lostT:0,cfg:null,time:0,dangerT:0,lastColor:-1,runLen:0,fixT:0,rot:0,rph:0,rotDir:1,dropOn:false,breakOn:false,lastBeat:-1,vaca:null,vacaT:20,beam:null,coin:null,coinT:10,rings:[],flash:0,banner:null,bannerDone:false,top:60};

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function levelCfg(n,seed){const r=mulberry((seed||n)*9973+7);return{boss:!seed&&n%5===0,stones:n>=3?Math.min(.06,.02+n*.003):0,ncol:Math.min(6,4+Math.floor((n-1)/3)),total:Math.min(160,45+n*7),speed:Math.min(2.3,0.75+n*0.07),turns:2+(n%3)*0.45+Math.min(1,n*0.05),dir:n%2?1:-1,a0:r()*Math.PI*2,power:n>=2?0.05:0.035,theme:THEMES[(n-1)%THEMES.length]}}
const lenB=()=>L/D,TOUCH=1.03,SWAY=.075;
let trk=null;
function rotP(x,y,a){const c=Math.cos(a),sn=Math.sin(a),dx=x-cx,dy=y-cy;return{x:cx+dx*c-dy*sn,y:cy+dx*sn+dy*c}}
function posS(s){const p=posAt(s),q=rotP(p.x,p.y,G.rot||0);q.a=p.a+(G.rot||0);return q}
const toLocal=(x,y)=>rotP(x,y,-(G.rot||0));
const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function dailyCfg(){const d=dayNum(),r=mulberry(d*131),n=6+Math.floor(r()*5),c=levelCfg(n,d+5000);c.stones=.05;c.power=.07;c.boss=r()<.4;c.total=Math.min(140,c.total+15);return c}

/* ---------- layout ---------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  D=Math.max(20,Math.min(44,Math.min(W,H-70)/14));R=D/2;
  buildSprites();buildPath();
}
function buildPath(){
  const c=G.cfg||levelCfg(1);
  const top=$('hud').offsetHeight+6,bot=14;G.top=top;
  cx=W/2;cy=top+(H-top-bot)/2;
  const hw=W/2-R-8,hh=(H-top-bot)/2-R-4,SW=Math.sin(SWAY)*1.05,rx=Math.max(hw*.6,hw-hh*SW),ry=Math.max(hh*.6,hh-hw*SW),m=Math.min(rx,ry);
  const fmin=Math.min(0.6,2.9*D/m);
  const T=Math.max(1.2,Math.min(c.turns,m*(1-fmin)/(1.18*D)));
  const N=2400,tot=T*Math.PI*2;pts=[];cum=[0];
  for(let i=0;i<=N;i++){const t=i/N,f=1-t*(1-fmin),a=c.a0+c.dir*t*tot;pts.push([cx+rx*f*Math.cos(a),cy+ry*f*Math.sin(a)]);if(i)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}
  L=cum[N];trackPath=new Path2D();trackPath.moveTo(pts[0][0],pts[0][1]);for(let i=4;i<=N;i+=4)trackPath.lineTo(pts[i][0],pts[i][1]);renderBG(c.theme);
}
function posAt(s){
  const px=s*D,N=pts.length-1;
  let lo=0,hi=N;
  if(px<=0)hi=1;else if(px>=L)lo=N-1;else while(hi-lo>1){const md=(lo+hi)>>1;if(cum[md]<px)lo=md;else hi=md}
  const k=Math.max(0,Math.min(1,(px-cum[lo])/((cum[hi]-cum[lo])||1))),dx=pts[hi][0]-pts[lo][0],dy=pts[hi][1]-pts[lo][1];
  return{x:pts[lo][0]+dx*k,y:pts[lo][1]+dy*k,a:Math.atan2(dy,dx)};
}
function tangentS(s){const a=posAt(s).a+(G.rot||0);return{x:Math.cos(a),y:Math.sin(a)}}
function buildSprites(){
  sprites=COLORS.map(([l,d])=>{const s=Math.ceil(D*DPR)+2,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d'),r=s/2;
    const gr=g.createRadialGradient(r*.68,r*.6,r*.08,r,r,r);gr.addColorStop(0,'#fff');gr.addColorStop(.2,l);gr.addColorStop(1,d);
    g.fillStyle=gr;g.beginPath();g.arc(r,r,r*.94,0,7);g.fill();g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=s*.04;g.stroke();
    g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(r*.7,r*.55,r*.22,r*.13,-.6,0,7);g.fill();return c});
  {const c=sprites[STONE],g=c.getContext('2d'),r=c.width/2;g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=c.width*.05;for(const[a,b]of[[.5,1.4],[1.3,1.6],[.9,.4]]){g.beginPath();g.arc(r*a,r*b,r*.12,0,7);g.stroke()}}
}
function renderBG(th){
  bg=document.createElement('canvas');bg.width=W*DPR;bg.height=H*DPR;const g=bg.getContext('2d');g.scale(DPR,DPR);
  const gr=g.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*.75);gr.addColorStop(0,th.a);gr.addColorStop(1,th.b);g.fillStyle=gr;g.fillRect(0,0,W,H);
  const r=mulberry(42);
  for(let i=0;i<60;i++){g.fillStyle=`rgba(255,240,200,${.02+r()*.04})`;const x=r()*W,y=r()*H,s=6+r()*40;g.beginPath();g.ellipse(x,y,s,s*.6,r()*3,0,7);g.fill()}
  g.strokeStyle=th.n;g.globalAlpha=.07;g.lineWidth=1;for(let x=(W%40)/2;x<W;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=(H%40)/2;y<H;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}g.globalAlpha=1;
  for(let i=0;i<0;i++){g.strokeStyle=`rgba(120,200,90,${.05+r()*.08})`;g.lineWidth=2;const x=r()*W,y=r()*H;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+(r()-.5)*40,y-20,x+(r()-.5)*30,y-30-r()*30);g.stroke()}
  trk=document.createElement('canvas');trk.width=W*DPR;trk.height=H*DPR;const t=trk.getContext('2d');t.scale(DPR,DPR);
  const trace=()=>{t.beginPath();t.moveTo(pts[0][0],pts[0][1]);for(let i=3;i<pts.length;i+=3)t.lineTo(pts[i][0],pts[i][1]);t.lineTo(pts[pts.length-1][0],pts[pts.length-1][1])};
  t.lineCap='round';t.lineJoin='round';
  trace();t.strokeStyle='rgba(0,0,0,.55)';t.lineWidth=D*1.5;t.stroke();t.strokeStyle=th.n;t.globalAlpha=.55;t.lineWidth=D*1.3;t.stroke();t.globalAlpha=1;
  t.strokeStyle=th.t;t.lineWidth=D*1.16;t.stroke();
  t.strokeStyle=th.t2;t.lineWidth=D*.86;t.stroke();
  t.setLineDash([2,D*.55]);t.strokeStyle='rgba(0,0,0,.3)';t.lineWidth=D*.86;t.stroke();t.setLineDash([]);
  const p=pts[0];t.fillStyle='#0a0805';t.beginPath();t.arc(p[0],p[1],D*.78,0,7);t.fill();t.strokeStyle=th.n;t.lineWidth=3;t.stroke();
}

/* ---------- audio ---------- */
let AC=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();musStart=AC.currentTime;musLast=-1}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function tone(f,d,type,v,slide,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
let noiseBuf=null;
function noise(t,dur,freq,v){if(!AC||muted)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();src.buffer=noiseBuf;f.type='highpass';f.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);src.connect(f).connect(g).connect(AC.destination);src.start(t);src.stop(t+dur+.02)}
const STYLES={hard:{bpm:150,name:'Hardstyle 150'},techno:{bpm:132,name:'Techno 132'},off:{bpm:128,name:'Música apagada'}};
let song=null,songSrc=null,songAt=0,songPos=0,songGain=null,custom={bpm:store.get('extBpm',96)},taps=[];
const beatLen=()=>60/(style==='file'&&song?song.bpm:style==='ext'?custom.bpm:(STYLES[style]||STYLES.hard).bpm);
const builtIn=()=>style==='hard'||style==='techno';
let musStart=0,shaper=null,musLast=-1;
const clockNow=()=>AC?AC.currentTime-(AC.outputLatency||0):performance.now()/1000;
function beatPhase(){const x=(clockNow()-musStart)/beatLen();return x-Math.floor(x)}
function beatPulse(){const ph=beatPhase();return ph<.3?(1-ph/.3)**2:0}
function getShaper(){if(!shaper){shaper=AC.createWaveShaper();const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/n*2-1;c[i]=Math.tanh(x*6)}shaper.curve=c;const g=AC.createGain();g.gain.value=.55;shaper.connect(g).connect(AC.destination)}return shaper}
function kick(t,hard){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(hard?260:170,t);o.frequency.exponentialRampToValueAtTime(hard?52:48,t+(hard?.09:.12));
  g.gain.setValueAtTime(hard?.9:.7,t);g.gain.setValueAtTime(hard?.75:.5,t+.08);g.gain.exponentialRampToValueAtTime(.001,t+(hard?.38:.3));
  o.connect(g);if(hard)g.connect(getShaper());else g.connect(AC.destination);o.start(t);o.stop(t+.42)}
function synth(t,f,dur,type,v,cut,det){for(const d of det){const o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type=type;o.frequency.value=f;o.detune.value=d;fl.type='lowpass';fl.frequency.setValueAtTime(cut,t);fl.frequency.exponentialRampToValueAtTime(Math.max(200,cut*.25),t+dur);fl.Q.value=4;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(fl).connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}}
const PROG=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]];
const LEAD=[0,0,2,0,1,0,2,1,0,0,2,0,1,2,0,1];
const ARP=[0,1,2,1,0,2,1,2,0,1,2,1,2,1,0,2];
function playStep(i,t){
  const hard=style==='hard',s16=i%16,bar=Math.floor(i/16),ch=PROG[bar%4],brk=bar%8===7,full=(bar>=8&&bar%16>=8)||G.bannerDone,danger=G.balls.length?G.balls[G.balls.length-1].s/lenB():0;
  if(brk){noise(t,.06,1500+s16*350,.02+s16*.009);if(s16>=8)noise(t,.05,1200,.05+(s16-8)*.012);if(s16===0)synth(t,ch[0]/2,beatLen()*3.5,'sawtooth',.05,300,[0,7]);if(s16%4===0)synth(t,ch[0]*2,.08,'square',.02,2000,[0]);return}
  if(s16%4===0){kick(t,hard);if(G.fx.rave>0)kick(t+.002,false)}
  if(G.fx.rave>0)noise(t,.04,5000,.04);
  if(s16%4===2)noise(t,hard?.07:.12,hard?7000:6000,hard?.06:.07);
  else noise(t,.025,9000,.012);
  if(s16===4||s16===12)noise(t,.14,1300,hard?.16:.1);
  if(hard){ if(s16%4===2)synth(t,ch[0]/4,beatLen()*.4,'sawtooth',.11,900,[0,-12]); }

let lastBar=-1;
function updBar(){const w=Math.round(G.spawned/Math.max(1,G.total)*100);if(w!==lastBar){$('barf').style.width=w+'%';lastBar=w}}
function updHUD(){$('lv').textContent=G.daily?'Día':G.lvl;$('sc').textContent=G.score.toLocaleString('es-AR');$('lives').textContent='❤'.repeat(Math.max(0,G.lives));updBar()}
function showOv(title,html,btns){
  $('ovt').textContent=title;$('ovx').innerHTML=html;$('ovx').onclick=null;$('ovx').oninput=null;$('ovx').onpointerdown=null;G.preview=false;const box=$('ovb');box.innerHTML='';
  for(const b of btns){const el=document.createElement('button');el.className='btn'+(b.alt?' alt':'')+(b.half?' half':'');el.textContent=b.t;el.addEventListener('click',()=>{audioInit();b.fn()});box.appendChild(el)}
  $('ov').classList.remove('hidden');
}
function hideOv(){$('ov').classList.add('hidden')}
function menu(){
  G.state='menu';G.balls=[];G.shots=[];G.cfg=levelCfg(1);buildPath();
  const nextStyle={hard:'techno',techno:'off',off:'hard'};
  showOv('Espiral del Templo',`<p>Que las bolas no lleguen al pozo. Juntá 3 o más del mismo color. <b>Disparando al ritmo del bombo, la jugada vale doble.</b></p>

  <p>Récord: <b>${best.toLocaleString('es-AR')}</b></p>${host?'<p style="font-size:14px">🪙 Ganás vaccoins de FUNVS: 5 por estrella nueva, 20 por jefe y 15 por el desafío del día.</p>':''}`,
  [{t:'Jugar',fn:()=>startLevel(1,true)},...(maxLvl>1?[{t:'Seguir en nivel '+maxLvl,alt:1,fn:()=>startLevel(maxLvl,true)}]:[]),{t:'Desafío del día',alt:1,fn:()=>startLevel(0,true,true)},{t:'Niveles',alt:1,half:1,fn:levelsMap},{t:'Tótems',alt:1,half:1,fn:skinsMenu},{t:'♫ '+musicName(),alt:1,half:1,fn:musicMenu},{t:muted?'Sonido: no':'Sonido: sí',alt:1,half:1,fn:()=>{muted=!muted;store.set('muted',muted);menu()}},{t:'Cómo se juega',alt:1,fn:howTo}]);
}
function howTo(){showOv('Cómo se juega',`  <div class="legend"><span>👆</span><span>Apuntá con el dedo y soltá para disparar</span><span>🗿</span><span>Tocá el tótem para cambiar de bola</span><span>◷ ≪</span><span>Bolas con reloj: cámara lenta · con flechas: reversa</span><span>✸ ⌖</span><span>Con estrella: bomba · con mira: láser</span><span>$</span><span>Pegale a las monedas para puntos extra</span><span>◯</span><span>El anillo que se achica marca el beat: soltá cuando brilla</span><span>⬤</span><span>Bolas grises: piedras, se rompen explotando bolas al lado</span><span>☠</span><span>Cada 5 niveles, un jefe: pegale directo</span><span>⚡</span><span>En el DROP la espiral se mueve más y cada explosión arrastra una bola de cada lado</span><span>♦</span><span>Bola con rombo: espejo, cambia todos los colores</span><span>🐕</span><span>Vaca se come la cola de la cadena; explotá bolas cerca de ella para que coma más</span><span>☠</span><span>El jefe tiene escudo: pegale al ritmo, o fuerte cuando la música se corta</span></div>`,[{t:'Volver',fn:menu}])}
function skinsMenu(){
  const tot=totalStars();let h='<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">';
  for(const k of SKINS){const open=tot>=k.need;h+=`<button class="skin${k.id===skin?' sel':''}" data-s="${k.id}" ${open?'':'disabled'}><i style="background:radial-gradient(circle at 35% 30%,${k.c[0]},${k.c[1]} 60%,${k.c[2]})"></i>${k.n}<small>${open?(k.id===skin?'Elegido':'Elegir'):'★ '+k.need}</small></button>`}
  showOv('Tótems',h+`</div><p>Tenés <b>${tot}</b> estrellas. Ganá más en los niveles para desbloquear.</p>`,[{t:'Menú',alt:1,fn:menu}]);
  $('ovx').onclick=e=>{const b=e.target.closest('[data-s]');if(b&&!b.disabled){skin=b.dataset.s;store.set('skin',skin);skinsMenu()}};
}
function levelsMap(){
  G.state='menu';const last=Math.max(12,Math.ceil((maxLvl+1)/4)*4);let h='<div class="grid">';
  for(let i=1;i<=last;i++){const st=stars[i]||0,open=i<=maxLvl;h+=`<button class="lvb" data-l="${i}" ${open?'':'disabled'}>${open?i:'🔒'}<small>${open?'★'.repeat(st)+'☆'.repeat(3-st):''}</small></button>`}
  const tot=totalStars();
  showOv('Niveles',h+`</div><p>Estrellas: <b>${tot}</b></p>`,[{t:'Menú',alt:1,fn:menu}]);
  $('ovx').onclick=e=>{const b=e.target.closest('[data-l]');if(b&&!b.disabled){audioInit();startLevel(+b.dataset.l,true)}};
}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function musicName(){if(style==='file'&&song)return song.name.slice(0,14);if(style==='ext')return 'Afuera '+custom.bpm+' BPM';return (STYLES[style]||STYLES.hard).name.replace('Música apagada','Sin música')}
function curBpm(){return style==='file'&&song?song.bpm:custom.bpm}
function setStyle(st){style=st;if(st!=='file')store.set('style',st);if(AC&&!(st==='file'))musStart=AC.currentTime;musLast=-1;menu()}
function musicMenu(){
  showOv('Música',`<p>Elegí con qué jugar. Todo el juego late al ritmo de lo que elijas.</p>`,[
    {t:'Hardstyle 150',fn:()=>setStyle('hard')},{t:'Techno 132',alt:1,fn:()=>setStyle('techno')},
    {t:'Un tema de mi celu',alt:1,fn:pickFile},{t:'Desde YouTube o Spotify',alt:1,fn:extMenu},
    {t:'Sin música',alt:1,half:1,fn:()=>setStyle('off')},{t:'Volver',alt:1,half:1,fn:menu}]);
}
function syncHTML(msg){const b=curBpm();return `<div class="bpm"><button data-a="half">÷2</button><button data-a="m">−</button><input id="bpmIn" type="number" inputmode="decimal" step="0.5" min="50" max="220" value="${b}"><button data-a="p">+</button><button data-a="dbl">×2</button></div><div id="bd" class="dot"></div><button id="tap" class="tapb">TAP</button><p style="font-size:14px">${msg}</p>`}
function setBpm(v){v=Math.round(Math.max(50,Math.min(220,v))*2)/2;if(!v)return;if(style==='file'&&song){song.bpm=v;musStart=songAt+song.offset}else{custom.bpm=v;store.set('extBpm',v)}const i=$('bpmIn');if(i&&document.activeElement!==i)i.value=v}
function doTap(){
  audioInit();const t=clockNow();if(taps.length&&t-taps[taps.length-1]>2)taps=[];taps.push(t);if(taps.length>8)taps.shift();
  const bd=$('bd');if(bd){bd.style.background='#fff';setTimeout(()=>{bd.style.background=''},80)}
  if(taps.length>=4){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);setBpm(60/iv);const i=$('bpmIn');if(i)i.value=curBpm()}
  if(taps.length>=2){const bl=beatLen();if(style==='file'&&song){song.offset=(((t-songAt)%bl)+bl)%bl;musStart=songAt+song.offset}else musStart=t;G.synced=true}
}
function bindSync(){
  const o=$('ovx');
  o.onpointerdown=e=>{if(e.target.id==='tap'){e.preventDefault();doTap()}};
  o.onclick=e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;const b=curBpm();setBpm(a==='half'?b/2:a==='dbl'?b*2:a==='m'?b-.5:b+.5);$('bpmIn').value=curBpm()};
  o.oninput=e=>{if(e.target.id==='bpmIn'){const v=parseFloat(e.target.value);if(v>=50&&v<=220)setBpm(v)}};
}
function extMenu(){
  style='ext';taps=[];
  showOv('Desde YouTube o Spotify',`<ol class="steps"><li>Poné el tema en YouTube o Spotify y dejalo sonando de fondo.</li><li>Volvé acá y escribí los BPM que buscaste, o tocá TAP al ritmo del bombo (4 veces o más).</li><li>Fijate que el círculo lata junto con la música.</li></ol>${syncHTML('Si el juego corta la música, apagá el Sonido del juego en el menú. Los temas de reggaetón suelen andar entre 88 y 100 BPM.')}`,
  [{t:'Listo, a jugar',fn:()=>{store.set('style','ext');startLevel(Math.max(1,maxLvl),true)}},{t:'Volver al menú',alt:1,fn:()=>{store.set('style','ext');menu()}}]);
  bindSync();
}
function pickFile(){const i=$('file');i.value='';i.click()}
$('file').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;audioInit();
  showOv('Analizando el tema…',`<p>Buscando los BPM y dónde cae cada golpe de <b>${esc(f.name)}</b>.</p>`,[]);
  try{
    const ab=await f.arrayBuffer(),buf=await new Promise((res,rej)=>{const pr=AC.decodeAudioData(ab,res,rej);if(pr&&pr.then)pr.then(res,rej)});
    const r=await detectBPM(buf);
    if(songSrc){try{songSrc.stop()}catch(_){}songSrc=null}
    song={buf,name:f.name.replace(/\.[^.]+$/,''),bpm:r.bpm,offset:r.offset};songPos=0;style='file';fileMenu();
  }catch(err){showOv('No pude leer ese archivo','<p>Probá con un MP3 o M4A que tengas guardado en el celu.</p>',[{t:'Volver',fn:musicMenu}])}
});
function fileMenu(){
  taps=[];showOv(song.name,`<p>Detecté <b>${song.bpm} BPM</b>.</p>${syncHTML('El círculo tiene que latir con el bombo. Si no coincide, poné los BPM que buscaste (o probá ×2 / ÷2) y tocá TAP al ritmo.')}`,
  [{t:'Jugar con este tema',fn:()=>startLevel(Math.max(1,maxLvl),true)},{t:'Volver al menú',alt:1,fn:menu}]);
  bindSync();G.preview=true;
}
async function detectBPM(buf){
  const SR=22050,start=Math.min(buf.duration*.15,20),len=Math.max(5,Math.min(buf.duration-start,60));
  const oc=new(window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,Math.floor(len*SR),SR);
  const src=oc.createBufferSource(),lp=oc.createBiquadFilter();src.buffer=buf;lp.type='lowpass';lp.frequency.value=150;src.connect(lp).connect(oc.destination);src.start(0,start,len);
  const out=await new Promise((res,rej)=>{const pr=oc.startRendering();if(pr&&pr.then)pr.then(res,rej);else oc.oncomplete=e=>res(e.renderedBuffer)});
  const d=out.getChannelData(0),hop=110,hs=hop/SR,n=Math.floor(d.length/hop),env=new Float32Array(n),on=new Float32Array(n);
  for(let i=0;i<n;i++){let e=0;for(let j=0;j<hop;j++){const v=d[i*hop+j];e+=v*v}env[i]=Math.sqrt(e/hop)}
  for(let i=1;i<n;i++)on[i]=Math.max(0,env[i]-env[i-1]);
  const minL=Math.floor(60/200/hs),maxL=Math.ceil(60/60/hs),sc=new Float32Array(maxL+2);
  for(let L=minL;L<=maxL+1;L++){let t=0;for(let i=0;i+L<n;i++)t+=on[i]*on[i+L];const bpm=60/(L*hs);sc[L]=t*(1+.3*Math.exp(-(((bpm-110)/45)**2)))}
  let bl=minL;for(let L=minL+1;L<=maxL;L++)if(sc[L]>sc[bl])bl=L;
  const a=sc[bl-1]||0,b=sc[bl],c=sc[bl+1]||0,den=a-2*b+c,lag=bl+(den?.5*(a-c)/den:0);
  let bpm=60/(lag*hs);while(bpm<75)bpm*=2;while(bpm>170)bpm/=2;bpm=Math.round(bpm*2)/2;
  const P=60/bpm/hs;let bp=0,bs=-1;for(let ph=0;ph<P;ph++){let t=0;for(let k=ph;k<n;k+=P)t+=on[Math.round(k)]||0;if(t>bs){bs=t;bp=ph}}
  const beat=60/bpm;return{bpm,offset:(((start+bp*hs)%beat)+beat)%beat};
}
function songSync(){
  if(!AC)return;const want=style==='file'&&song&&(G.preview||['play','lost','win','over'].includes(G.state));
  if(want&&!songSrc){if(!songGain){songGain=AC.createGain();songGain.gain.value=.9;songGain.connect(AC.destination)}
    songSrc=AC.createBufferSource();songSrc.buffer=song.buf;songSrc.connect(songGain);const pos=songPos%song.buf.duration;songSrc.start(0,pos);songAt=AC.currentTime-pos;musStart=songAt+song.offset;musLast=-1}
  else if(!want&&songSrc){songPos=AC.currentTime-songAt;try{songSrc.stop()}catch(_){}songSrc=null}
  if(songSrc&&AC.currentTime-songAt>=song.buf.duration-.03){try{songSrc.stop()}catch(_){}songSrc=null;songPos=0}
}
function pause(){
  if(G.state!=='play')return;G.state='pause';
  const sync=style==='ext'||style==='file';
  showOv('Pausa',`<p>${G.daily?'Desafío':'Nivel '+G.lvl} · ${G.score.toLocaleString('es-AR')} pts</p>${sync?syncHTML('Si el círculo no late con la música, tocá TAP al ritmo 4 veces o más.'):''}`,[{t:'Seguir',fn:()=>{G.state='play';hideOv()}},{t:'Reiniciar',alt:1,fn:()=>{if(G.daily)startLevel(0,true,true);else{G.score=G.lvlStartScore;startLevel(G.lvl,false)}}},{t:'Menú',alt:1,fn:()=>{saveBest();menu()}}]);
  if(sync)bindSync();
}

/* ---------- input ---------- */
let aiming=false;
function setAim(x,y){G.aim=Math.atan2(y-cy,x-cx)}
cv.addEventListener('pointerdown',e=>{audioInit();if(G.state!=='play')return;if(Math.hypot(e.clientX-cx,e.clientY-cy)<D*1.3){swap();return}aiming=true;setAim(e.clientX,e.clientY);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(G.state!=='play')return;if(aiming||e.pointerType==='mouse')setAim(e.clientX,e.clientY)});
cv.addEventListener('pointerup',e=>{if(!aiming)return;aiming=false;setAim(e.clientX,e.clientY);shoot()});
cv.addEventListener('pointercancel',()=>{aiming=false});
cv.addEventListener('contextmenu',e=>{e.preventDefault();swap()});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();swap()}else if(e.code==='Escape'||e.code==='KeyP')pause()});
$('pz').addEventListener('click',()=>{audioInit();pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('resize',resize);

resize();menu();
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;songSync();update(dt);draw();const bd=document.getElementById('bd');if(bd)bd.style.transform=`scale(${1+beatPulse()*.7})`;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}
</script>

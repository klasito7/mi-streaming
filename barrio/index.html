<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Urbe · tu ciudad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: city builder de celu, claro y vivo, tipo SimCity / Cities: Skylines
   IDEA: una maqueta isométrica de ciudad que crece sola según calles, zonas y servicios
   PICTURE: el mapa grande en canvas, con zoom y arrastre, ocupando casi toda la pantalla
   COLOUR and TYPE: pasto, asfalto, verde/azul/amarillo de zonas RCI; Fredoka
   LAYOUT: datos arriba, mapa al medio, paleta de herramientas abajo, hoja deslizable */
:root{color-scheme:light dark;--sky1:light-dark(#7cc5f2,#0d1730);--sky2:light-dark(#cfeaff,#1d2b4f);--ink:light-dark(#1f2d45,#eef3ff);--card:light-dark(#fff,#18223d);--soft:light-dark(#eef4fa,#232f50);--muted:light-dark(#5f6f88,#9fadc9);--line:light-dark(#e1e8f0,#2f3b60);--R:#4cbb5e;--C:#3f86e0;--I:#e0a91f;--gold:#ffc83d;--red:#ff5a5a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:16px/1.4 Fredoka,ui-rounded,system-ui,sans-serif;background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;flex-wrap:nowrap}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:5px 10px;box-shadow:0 3px 0 rgba(0,0,0,.12);font-weight:600;white-space:nowrap;font-size:15px}
.pill small{color:var(--muted);font-weight:500;font-size:13px}
.money{flex:1 1 auto}.neg{color:var(--red)!important}
.bell{position:relative;flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--card);font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.12);cursor:pointer}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.hidden{display:none!important}
#sub{display:flex;align-items:center;gap:10px;padding:2px 12px 6px;font-size:13px;font-weight:500;color:light-dark(#173a63,#c8d6f5);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.rci{display:flex;align-items:flex-end;gap:2px;height:22px}
.rci i{display:block;width:8px;border-radius:2px;position:relative}
.rci b{font-size:10px;width:8px;text-align:center}
#stage{position:relative;flex:1 1 auto;min-height:200px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.fab{position:absolute;border:0;border-radius:14px;background:var(--card);box-shadow:0 3px 0 rgba(0,0,0,.15);font:600 14px Fredoka,system-ui;color:var(--ink);padding:8px 10px;min-height:40px;cursor:pointer}
#layers{left:10px;top:8px}#zin{right:10px;top:8px;width:40px}#zout{right:10px;top:54px;width:40px}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(20,30,50,.78);color:#fff;font-size:13px;padding:6px 12px;border-radius:12px;white-space:nowrap;pointer-events:none}
#palette{background:var(--card);box-shadow:0 -6px 18px rgba(0,0,0,.12);border-radius:20px 20px 0 0;padding:8px 0 4px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 10px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar,#sub::-webkit-scrollbar{display:none}
.cat{flex:none;border:0;border-radius:12px;padding:7px 10px;background:var(--soft);color:var(--ink);font:600 14px Fredoka,system-ui;cursor:pointer;min-height:38px}
.cat.on{background:#22304a;color:#fff}
.it{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;width:78px;border:2px solid transparent;border-radius:14px;padding:6px 4px;background:var(--soft);color:var(--ink);font:500 12px/1.15 Fredoka,system-ui;cursor:pointer;text-align:center}
.it .e{font-size:22px}.it small{color:var(--muted);font-size:11px}
.it.on{border-color:#22304a;background:light-dark(#fff,#2b3860)}.it.lk{opacity:.45}
.it.zR .e{color:var(--R)}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{position:relative;flex:1;border:0;background:none;color:var(--muted);font:600 14px Fredoka,system-ui;padding:9px 0 11px;cursor:pointer;min-height:46px}
nav button.on{color:var(--ink)}nav button.on::after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:3px;background:var(--C)}
nav .badge{top:4px;right:calc(50% - 44px)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.22);padding:14px 16px 16px;animation:up .22s ease-out;z-index:3}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.x{position:sticky;top:0;float:right;border:0;background:var(--soft);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;z-index:2}
.btn{border:0;border-radius:14px;padding:10px 14px;min-height:44px;font:600 15px Fredoka,system-ui;color:#fff;background:#2fa84f;box-shadow:0 4px 0 #227a39;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #227a39}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 4px 0 #cf9411}
.btn.blue{background:var(--C);box-shadow:0 4px 0 #2a5fa6}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px}
.btn:disabled{filter:grayscale(1);opacity:.45;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--C);outline-offset:2px}
h2{margin:0 0 2px;font-size:22px;line-height:1.1;font-weight:600}
h3{margin:14px 0 6px;font-size:14px;color:var(--muted);font-weight:500}
p{margin:5px 0}.muted{color:var(--muted);font-size:14px}
.box{background:var(--soft);border-radius:16px;padding:12px;margin:8px 0}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}
.line b{white-space:nowrap}
.bar{height:10px;border-radius:9px;background:light-dark(#d6e0ec,#33406a);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:#2fa84f;border-radius:9px;transition:width .25s linear}
.dem{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:center;margin:4px 0}
.dem .t{position:relative;height:12px;background:light-dark(#d6e0ec,#33406a);border-radius:8px}
.dem .t::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
.dem .t i{position:absolute;top:0;bottom:0;border-radius:8px}
.ok{color:#2fa84f}.bad{color:var(--red)}
.tax{display:flex;align-items:center;gap:10px}.tax b{font-size:22px;min-width:52px;text-align:center}
.nt{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.nt .ti{font-size:22px}.nt small{display:block;color:var(--muted);font-size:13px}
.nt.unread b::after{content:" ●";color:var(--red);font-size:12px}
.ms{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.ms.done{opacity:.5}
#toasts{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:min(94vw,420px);display:flex;flex-direction:column;gap:6px;z-index:9;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:tin .3s ease-out;transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(-12px)}
.toast .ti{font-size:24px}.toast small{display:block;color:var(--muted);font-size:14px}
.toast.warn{border-left:5px solid var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(-16px)}}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;z-index:8;padding:16px}
.mbox{background:var(--card);border-radius:24px;padding:22px;width:min(100%,380px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mbox .btn{width:100%;margin-top:14px}
.list{text-align:left;margin:10px 0;padding:0;list-style:none;max-height:38vh;overflow:auto}
.list li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.big{font-size:26px;font-weight:700;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pill money">💰 <span id="money">0</span> <small id="net"></small></div>
    <div class="pill">👥 <span id="pop">0</span></div>
    <div class="pill">😊 <span id="happy">0</span>%</div>
    <button class="bell" id="bell" aria-label="Avisos">🔔<span class="badge hidden" id="nbadge"></span></button>
  </header>
  <div id="sub"></div>
  <main id="stage">
    <canvas id="cv"></canvas>
    <button class="fab" id="layers">🗺️ Capas: <span id="lyr">ninguna</span></button>
    <button class="fab" id="zin" aria-label="Acercar">＋</button>
    <button class="fab" id="zout" aria-label="Alejar">－</button>
    <div id="hint"></div>
    <section id="sheet" class="hidden"></section>
  </main>
  <div id="palette"><div class="strip" id="cats"></div><div class="strip" id="items"></div></div>
  <nav>
    <button data-nav="build" class="on">🛠️ Construir</button>
    <button data-nav="city">📊 Ciudad<span class="badge hidden" id="cbadge"></span></button>
    <button data-nav="notifs">🔔 Avisos</button>
  </nav>
</div>
<div id="toasts"></div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
<script>
{
/* ================= datos del juego ================= */
const N=20, TW0=64, TH0=32, KEY='urbe-v1', H2=2*3600e3, H8=8*3600e3, OFF_CAP=8*3600e3;
const ZN={
  R:{name:'Residencial',ic:'🏠',tint:'#9fd892',cap:[0,6,16,40],pw:1,wt:2,unit:'habitantes'},
  C:{name:'Comercial',ic:'🛍️',tint:'#a7c6ef',cap:[0,4,10,24],pw:2,wt:1,unit:'empleos'},
  I:{name:'Industrial',ic:'🏭',tint:'#eed28a',cap:[0,8,18,36],pw:3,wt:3,unit:'empleos'}
};
const GROW=[0,30e3,15*60e3,H2];
const B={
  wind:{name:'Molino eólico',ic:'🌬️',cat:'energia',cost:500,up:3,build:20,unlock:0,power:20,col:'#e8eef5',max:3},
  coal:{name:'Central térmica',ic:'🏭',cat:'energia',cost:3000,up:25,build:300,unlock:0,power:120,pol:[3,2],col:'#8a8f99',max:3},
  nuclear:{name:'Central nuclear',ic:'☢️',cat:'energia',cost:40000,up:120,build:H8/1000,unlock:3000,power:900,col:'#d8dde6',max:1},
  tower:{name:'Torre de agua',ic:'💧',cat:'energia',cost:600,up:4,build:20,unlock:0,water:40,col:'#7cc0f0',max:3},
  pump:{name:'Bomba de agua',ic:'🚰',cat:'energia',cost:2500,up:15,build:300,unlock:300,water:200,needWater:1,col:'#4aa3df',max:3},
  park:{name:'Plaza',ic:'🌳',cat:'parques',cost:200,up:1,build:10,unlock:0,r:3,cov:'park',col:'#5fb85a',max:1},
  bigpark:{name:'Parque grande',ic:'🎡',cat:'parques',cost:2500,up:8,build:600,unlock:700,r:5,cov:'park',col:'#4caf50',max:1},
  police:{name:'Comisaría',ic:'🚓',cat:'servicios',cost:1200,up:8,build:120,unlock:100,r:5,cov:'police',col:'#3b6fd1',max:3},
  fire:{name:'Bomberos',ic:'🚒',cat:'servicios',cost:1200,up:8,build:120,unlock:100,r:5,cov:'fire',col:'#d9453b',max:3},
  clinic:{name:'Hospital',ic:'🏥',cat:'servicios',cost:2000,up:12,build:300,unlock:300,r:6,cov:'clinic',col:'#eef0f3',max:3},
  school:{name:'Escuela',ic:'🏫',cat:'servicios',cost:2000,up:12,build:300,unlock:300,r:6,cov:'school',col:'#e7a64a',max:3},
  obelisco:{name:'Obelisco',ic:'🗼',cat:'monumentos',cost:20000,up:20,build:4*3600,unlock:1500,r:8,cov:'lm',col:'#f4f1ea',max:1},
  estadio:{name:'Estadio',ic:'🏟️',cat:'monumentos',cost:50000,up:60,build:H8/1000,unlock:3000,r:7,cov:'lm',tour:300,col:'#2f6bff',max:1},
  aero:{name:'Aeropuerto',ic:'✈️',cat:'monumentos',cost:120000,up:150,build:H8/1000,unlock:6000,tour:900,pol:[3,1],col:'#c9d2de',max:1}
};
const MS=[[0,'Aldea',0],[100,'Pueblo',5000],[300,'Villa',10000],[700,'Ciudad chica',20000],[1500,'Ciudad',40000],[3000,'Gran ciudad',80000],[6000,'Metrópolis',150000],[12000,'Megalópolis',300000]];
const CATS=[['ver','🔍 Ver'],['calles','🛣️ Calles'],['zonas','🏘️ Zonas'],['energia','⚡ Luz y agua'],['servicios','🚓 Servicios'],['parques','🌳 Parques'],['monumentos','🏛️ Monumentos'],['demoler','🚜 Demoler']];
const PAINT=new Set(['road','zR','zC','zI','dozer']);

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>Date.now();
function fmt(n){const s=n<0?'-':'';n=Math.abs(Math.floor(n));if(n<1000)return s+n;const u=['K','M','B'];let x=n,i=-1;while(x>=1000&&i<2){x/=1000;i++}return s+(x<10?x.toFixed(1):Math.floor(x))+u[i]}
const $$=n=>{const v=Math.floor(Math.abs(n));return (n<0&&v?'-$':'$')+fmt(v)};
function dur(ms){let s=Math.max(0,Math.ceil(ms/1000));if(s<60)return s+'s';let m=Math.floor(s/60);if(m<60)return m+'m '+(s%60)+'s';let h=Math.floor(m/60);if(h<24)return h+'h '+(m%60)+'m';return Math.floor(h/24)+'d '+(h%24)+'h'}
function rel(t){const s=(now()-t)/1000;if(s<60)return 'recién';if(s<3600)return 'hace '+Math.floor(s/60)+' min';if(s<86400)return 'hace '+Math.floor(s/3600)+' h';return 'hace '+Math.floor(s/86400)+' d'}
const rc=i=>[Math.floor(i/N),i%N], idx=(r,c)=>r*N+c, inb=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
const N4=i=>{const[r,c]=rc(i);return[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>inb(a,b)).map(([a,b])=>idx(a,b))};

/* ================= estado ================= */
function genMap(seed){let x=seed;const rnd=()=>(x=(x*16807)%2147483647)/2147483647;const t=[];
  const lr=2+Math.floor(rnd()*4),lc=12+Math.floor(rnd()*5);
  for(let i=0;i<N*N;i++){const[r,c]=rc(i);const d=Math.hypot((r-lr)*1.2,c-lc);
    t.push({g:d<2.6+rnd()*1.2?'water':(rnd()<.13&&Math.hypot(r-10,c-8)>3.5?'tree':'grass')})}
  return t}
function fresh(){const t=now(),seed=1+Math.floor(Math.random()*2e9);const s={v:2,money:30000,tax:9,ms:0,bonus:[],seed,t:genMap(seed),notifs:[],flags:{},last:t,savedAt:0,lastSeen:t};
  for(let c=3;c<17;c++)s.t[idx(10,c)]={g:'grass',o:{k:'road'}};
  s.notifs.push({id:'w',t,icon:'🏙️',title:'¡Bienvenido, intendente!',body:'Trazá calles, zonificá y dale luz y agua a tu ciudad.',read:false});return s}
function load(){try{const j=localStorage.getItem(KEY);if(j){const s=JSON.parse(j);if(s&&s.v===2)return s}}catch(e){}return fresh()}
const host=(()=>{try{return window.parent!==window&&window.parent.BarrioHost||null}catch(e){return null}})();
let S=load(),tool='ver',cat='ver',sel=null,sheet=null,dirty=true,dirtyHost=false,catching=null,CY=null,overlay=0,resetArm=0;

/* ================= simulación ================= */
function hasRoad(i){return N4(i).some(j=>S.t[j].o&&S.t[j].o.k==='road')}
function nearWater(i){const[r,c]=rc(i);for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++)if(inb(r+a,c+b)&&S.t[idx(r+a,c+b)].g==='water')return true;return false}
function city(){const n=N*N,cov={police:new Uint8Array(n),fire:new Uint8Array(n),clinic:new Uint8Array(n),school:new Uint8Array(n),park:new Uint8Array(n),lm:new Uint8Array(n)},pol=new Float32Array(n);
  let pS=0,wS=0,pU=0,wU=0,pop=0,jC=0,jI=0,upk=0,tour=0,roads=0,busy=0;
  const mark=(i,r,arr)=>{const[a,b]=rc(i);for(let x=-r;x<=r;x++)for(let y=-r;y<=r;y++)if(x*x+y*y<=r*r+.5&&inb(a+x,b+y))arr[idx(a+x,b+y)]=1};
  const pollute=(i,r,v)=>{const[a,b]=rc(i);for(let x=-r;x<=r;x++)for(let y=-r;y<=r;y++){const d=Math.hypot(x,y);if(d<=r+.5&&inb(a+x,b+y))pol[idx(a+x,b+y)]+=v*(1-d/(r+1))}};
  S.t.forEach((t,i)=>{const o=t.o;if(!o)return;
    if(o.k==='road'){roads++;return}
    if(o.k==='zone'){const z=ZN[o.z],l=o.l;if(!l)return;pU+=l*z.pw;wU+=l*z.wt;if(o.z==='R')pop+=z.cap[l];else if(o.z==='C')jC+=z.cap[l];else{jI+=z.cap[l];pollute(i,2,.5*l)}return}
    const d=B[o.b];upk+=d.up*(1+.3*(o.l-1));if(o.busy){busy++;if(o.busy.kind==='build')return}
    const m=1+.5*(o.l-1);pS+=(d.power||0)*m;wS+=(d.water||0)*m;tour+=d.tour||0;
    if(d.cov)mark(i,d.r+(o.l-1),cov[d.cov]);if(d.pol)pollute(i,d.pol[0],d.pol[1])});
  const pr=pU?Math.min(1,pS/pU):1,wr=wU?Math.min(1,wS/wU):1,jobs=jC+jI,lvAt=i=>{const t=S.t[i];let v=0;
    if(cov.park[i])v+=1.5;v+=.6*cov.police[i]+.6*cov.fire[i]+.8*cov.clinic[i]+.8*cov.school[i];if(cov.lm[i])v+=1.5;if(t.nw===undefined)t.nw=nearWater(i)?1:0;if(t.nw)v+=.5;return v-pol[i]*1.2};
  let hs=0,hn=0;S.t.forEach((t,i)=>{const o=t.o;if(!o||o.k!=='zone'||!o.l||o.z==='I')return;hn++;
    hs+=.3+.12*(cov.police[i]+cov.fire[i]+cov.clinic[i]+cov.school[i]+cov.park[i])+(cov.lm[i]?.1:0)-Math.min(.3,pol[i]*.08)});
  let happy=hn?hs/hn:.6;happy+=(9-S.tax)*.02;if(pr<1)happy-=.15;if(wr<1)happy-=.15;happy=Math.max(0,Math.min(1,happy));
  const tA=(9-S.tax)*3,hA=(happy-.5)*12;
  const dR=jobs-pop*.55+14+tA+hA,dC=pop*.25-jC+4+tA*.6,dI=pop*.35-jI+7+tA*.6;
  const income=(pop*.45+jobs*.5)*S.tax/9*Math.min(pr,wr)+tour,cost=upk+roads*.05;
  const crews=2+(pop>=1500)+(pop>=6000);
  return {cov,pol,lvAt,pS,wS,pU,wU,pr,wr,pop,jC,jI,jobs,happy,dem:{R:dR,C:dC,I:dI},income,cost,net:income-cost,tour,crews,busy,roads}}
function need(o,i,C){// por qué no crece (o '' si puede)
  if(!hasRoad(i))return 'Necesita una calle al lado';
  if(!C.pS||!C.wS)return 'Necesita luz y agua';
  if(C.pr<.95)return 'Falta electricidad';if(C.wr<.95)return 'Falta agua';
  if(S.money<-2000)return 'La ciudad está en rojo';
  const L=o.l+1;if(L>3)return 'Nivel máximo';
  if(L===2&&o.z!=='I'&&C.lvAt(i)<1.5)return 'Valor del suelo bajo (sumá plazas o servicios cerca)';
  if(L===3){if(C.pop<700)return 'Nivel 3 desde 700 habitantes';if(o.z==='I'){if(!C.cov.school[i])return 'Necesita una escuela cerca'}else if(C.lvAt(i)<3.2)return 'Valor del suelo bajo para torres'}
  return ''}
function step(dt,T,earn){const C=CY=city();
  if(earn)S.money+=C.net*dt/60000;
  // obras de servicios

function notify(icon,title,body){const n={id:Math.random().toString(36).slice(2),t:now(),icon,title,body,read:false};S.notifs.unshift(n);if(S.notifs.length>60)S.notifs.length=60;dirty=true;

const crewsFree=()=>(CY||city()).crews-S.t.filter(t=>t.o&&t.o.k==='b'&&t.o.busy).length;
const upCost=o=>Math.round(B[o.b].cost*1.5*o.l);
const upTime=o=>o.l===1?H2:H8;
const speedCost=ms=>Math.max(100,Math.ceil(ms/60000)*40);
function warn(t,b){toast('⚠️',t,b,'warn')}

function apply(i){const t=S.t[i],o=t.o;dirty=dirtyHost=true;
  if(tool==='dozer'){if(o){t.o=null;return true}if(t.g==='tree'){if(!pay(5))return false;t.g='grass';return true}return false}
  if(t.g==='water')return false;
  if(tool==='road'){if(o)return false;const c=10+(t.g==='tree'?5:0);if(!pay(c))return false;t.g='grass';t.o={k:'road'};return true}
  if(tool[0]==='z'&&tool.length===2){const z=tool[1];if(o&&(o.k!=='zone'||o.z===z))return false;if(t.g==='tree'){if(!pay(5))return false;t.g='grass'}t.o={k:'zone',z,l:0,ge:null};return true}
  if(tool.startsWith('b:')){const k=tool.slice(2),d=B[k];if(o){warn('Ese lugar está ocupado','Elegí un terreno libre');return false}
    if((CY||city()).pop<d.unlock){warn(`${d.name} se desbloquea con ${fmt(d.unlock)} habitantes`);return false}
    if(d.cov!=='park'&&!hasRoad(i)){warn('Necesita una calle al lado');return false}
    if(d.needWater&&!N4(i).some(j=>S.t[j].g==='water')){warn('La bomba va pegada al agua','Ponela al lado del lago');return false}
    if(crewsFree()<=0){const e=Math.min(...S.t.filter(x=>x.o&&x.o.k==='b'&&x.o.busy).map(x=>x.o.busy.e));warn('No hay cuadrillas libres',`Se libera una en ${dur(e-now())}`);return false}
    if(!pay(d.cost))return false;t.g='grass';const T=now();t.o={k:'b',b:k,l:1,busy:{kind:'build',s:T,e:T+d.build*1000}};
    toast('🏗️',`Construyendo ${d.name}`,`Listo en ${dur(d.build*1000)}`);sel=i;openSheet('tile');return true}
  return false}
function act(a,el){const T=now(),o=sel!=null&&S.t[sel].o;dirty=dirtyHost=true;
  if(a==='upgrade'&&o&&o.k==='b'){if(crewsFree()<=0)return warn('No hay cuadrillas libres');if(!pay(upCost(o)))return;o.busy={kind:'up',s:T,e:T+upTime(o)};toast('🏗️',`Ampliando ${B[o.b].name}`,`Esperá ${dur(upTime(o))} para esta mejora`)}
  else if(a==='speed'&&o&&o.busy){if(!pay(speedCost(o.busy.e-T)))return;o.busy.e=T;step(0,T,false)}
  else if(a==='tax'){S.tax=Math.max(5,Math.min(15,S.tax+ +el.dataset.d))}
  else if(a==='bonus'){const m=S.bonus.shift();if(m!=null){S.money+=MS[m][2];toast('💰',`Cobraste el bono de ${MS[m][1]}`,'+'+$$(MS[m][2]))}}
  else if(a==='perm'){try{Notification.requestPermission().then(()=>{dirty=true})}catch(e){}}
  else if(a==='readall')S.notifs.forEach(n=>n.read=true);
  else if(a==='reset'){if(T-resetArm>4000){resetArm=T;el.textContent='Tocá otra vez para confirmar';return}S=fresh();S.savedAt=now();sel=null;closeSheet();centerCam()}
  save(true)}

        for(const[a,b,dx,dy]of dirs)if(inb(a,b)&&S.t[idx(a,b)].o&&S.t[idx(a,b)].o.k==='road'){ctx.moveTo(cx,cy);ctx.lineTo(cx+dx,cy+dy);any=1}
        ctx.stroke();ctx.setLineDash([])}}
    if(i===sel||i===hover)poly(dia(cx,cy,TW/2-1,TH/2-.5),'rgba(255,255,255,.18)','#fff',2);
    if(t.g==='tree'&&!o){for(const[dx,dy,s]of[[-.14,-.02,1],[.12,.04,.85]]){const x=cx+TW*dx,y=cy+TH*dy,h=TW*.32*s;ctx.fillStyle='#6b4a2b';ctx.fillRect(x-TW*.015,y-h*.25,TW*.03,h*.25);poly([[x-TW*.1*s,y-h*.2],[x+TW*.1*s,y-h*.2],[x,y-h]],night?'#1f5a2c':'#2f8a3e')}}
    if(o&&o.k==='zone'){const tp=drawZone(i,o,cx,cy);
      if(TW>22){if(!hasRoad(i))emo('⛔',cx,tp-TW*.12,TW*.22);else if(o.l&&(C.pr<1||C.wr<1)&&Math.floor(tnow/600)%2)emo(C.pr<1?'⚡':'💧',cx,tp-TW*.14,TW*.24)}}
    if(o&&o.k==='b')drawB(i,o,cx,cy)}
  requestAnimationFrame(draw)}

/* ================= toques: arrastrar, pellizcar, pintar ================= */
const P=new Map();let g0=null,painting=false,lastTile=null,moved=false;
function zoomAt(f,x,y){const z=Math.max(.25,Math.min(2.4,cam.z*f));f=z/cam.z;cam.x=x-(x-cam.x)*f;cam.y=y-(y-cam.y)*f;cam.z=z}
function paintLine(a,b){if(a==null){apply(b);return}const[r0,c0]=rc(a),[r1,c1]=rc(b);let r=r0,c=c0;
  while(r!==r1||c!==c1){if(Math.abs(r1-r)>=Math.abs(c1-c))r+=Math.sign(r1-r);else c+=Math.sign(c1-c);if(!apply(idx(r,c))&&tool!=='dozer'&&tool!=='road'&&tool[0]!=='z')break}}
cv.addEventListener('pointerdown',e=>{if(e.isPrimary)P.clear();try{cv.setPointerCapture(e.pointerId)}catch(x){}const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;P.set(e.pointerId,{x,y});
  if(P.size===1){g0={x,y,cx:cam.x,cy:cam.y};moved=false;painting=PAINT.has(tool);lastTile=null;if(painting){const t=tileAt(x,y);if(t!=null){apply(t);lastTile=t}}}
  else if(P.size===2){painting=false;const[a,b]=[...P.values()];g0={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,z:cam.z,cx:cam.x,cy:cam.y}}});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(!P.has(e.pointerId)){if(e.pointerType==='mouse')hover=tileAt(x,y);return}
  P.set(e.pointerId,{x,y});
  if(P.size===2&&g0&&g0.d){const[a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    cam.x=g0.cx+(mx-g0.mx);cam.y=g0.cy+(my-g0.my);const target=Math.max(.25,Math.min(2.4,g0.z*d/g0.d));zoomAt(target/cam.z,mx,my);return}
  if(P.size!==1||!g0)return;if(Math.hypot(x-g0.x,y-g0.y)>7)moved=true;
  if(painting){const t=tileAt(x,y);if(t!=null&&t!==lastTile){paintLine(lastTile,t);lastTile=t}}
  else if(moved){cam.x=g0.cx+(x-g0.x);cam.y=g0.cy+(y-g0.y)}});
function up(e){const was=P.size;P.delete(e.pointerId);
  if(was===1&&!moved&&!painting&&g0&&g0.x!==undefined){const t=tileAt(g0.x,g0.y);if(t!=null){if(tool==='ver'){sel=t;openSheet('tile')}else apply(t)}}
  if(P.size===0){if(painting)save(true);painting=false;g0=null}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
cv.addEventListener('pointerleave',()=>hover=null);
$('#zin').onclick=()=>zoomAt(1.25,W/2,H/2);$('#zout').onclick=()=>zoomAt(.8,W/2,H/2);
const LYR=['ninguna','valor del suelo','contaminación'];$('#layers').onclick=()=>{overlay=(overlay+1)%3;$('#lyr').textContent=LYR[overlay]};

/* ================= paleta ================= */
function items(){if(cat==='calles')return[['road','🛣️','Calle','$10 c/u']];
  if(cat==='zonas')return['R','C','I'].map(z=>['z'+z,ZN[z].ic,ZN[z].name,'gratis']);
  if(cat==='demoler')return[['dozer','🚜','Demoler','árbol $5']];
  if(cat==='ver')return[];
  return Object.entries(B).filter(([,d])=>d.cat===cat).map(([k,d])=>['b:'+k,d.ic,d.name,$$(d.cost),d.unlock])}
function renderPalette(){const pop=(CY||city()).pop;
  $('#cats').innerHTML=CATS.map(([k,l])=>`<button class="cat ${k===cat?'on':''}" data-cat="${k}">${l}</button>`).join('');
  const it=items();$('#items').classList.toggle('hidden',!it.length);
  $('#items').innerHTML=it.map(([k,e,n,c,u])=>{const lk=u&&pop<u;return `<button class="it ${k===tool?'on':''} ${lk?'lk':''}" data-tool="${k}"><span class="e">${e}</span>${esc(n)}<small>${lk?'🔒 '+fmt(u)+' hab.':c}</small></button>`}).join('');
  $('#hint').textContent=tool==='ver'?'Tocá para ver · arrastrá para moverte · pellizcá para zoom':PAINT.has(tool)?'Deslizá el dedo para pintar · dos dedos para moverte':'Tocá un terreno libre junto a una calle';}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;const it=items();tool=cat==='ver'?'ver':it.length===1?it[0][0]:(it.find(x=>x[0]===tool)?tool:it[0][0]);if(tool!=='ver')closeSheet();renderPalette()});
$('#items').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;tool=b.dataset.tool;closeSheet();renderPalette()});

/* ================= hojas: casilla, ciudad, avisos ================= */
function openSheet(k){sheet=k;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===(k==='tile'?'build':k)));dirty=true}
function closeSheet(){sheet=null;sel=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav==='build'));$('#sheet').classList.add('hidden')}
function tileSheet(){const i=sel,t=S.t[i],o=t.o,C=CY;const lv=C.lvAt(i).toFixed(1);
  if(!o)return `<h2>${t.g==='water'?'Lago':t.g==='tree'?'Arboleda':'Terreno libre'}</h2><p class="muted">${t.g==='water'?'Las bombas de agua van pegadas al lago.':`Valor del suelo: <b>${lv}</b>. ${t.g==='tree'?'Despejarlo cuesta $5.':''}`}</p>`;
  if(o.k==='road')return `<h2>Calle</h2><p class="muted">Las zonas y los servicios necesitan una calle al lado. Mantenimiento: $0,05/min.</p>`;
  if(o.k==='zone'){const z=ZN[o.z],why=need(o,i,C);
    return `<h2>${z.ic} ${z.name} · nivel ${o.l}</h2><p class="muted">${o.l?`${z.cap[o.l]} ${z.unit}`:'Todavía no se construyó nada'}</p>
    <div class="box"><div class="line"><span>Calle</span><b class="${hasRoad(i)?'ok':'bad'}">${hasRoad(i)?'Sí':'No'}</b></div>
    <div class="line"><span>Luz y agua</span><b class="${C.pr>=1&&C.wr>=1&&C.pS&&C.wS?'ok':'bad'}">${C.pS&&C.wS?(C.pr>=1&&C.wr>=1?'Bien':'Falta'):'Sin red'}</b></div>
    <div class="line"><span>Valor del suelo</span><b>${lv}</b></div><div class="line"><span>Demanda ${z.name.toLowerCase()}</span><b class="${C.dem[o.z]>0?'ok':'bad'}">${C.dem[o.z]>0?'Alta':'Baja'}</b></div>
    ${['police','fire','clinic','school','park'].map(k=>C.cov[k][i]?'':`<div class="line"><span class="muted">Sin ${({police:'policía',fire:'bomberos',clinic:'hospital',school:'escuela',park:'plaza'})[k]} cerca</span></div>`).join('')}</div>
    ${o.ge?`<div class="box"><p>Construyendo nivel ${o.l+1} · faltan <b data-end="${o.ge.e}"></b></p><div class="bar"><i data-s="${o.ge.s}" data-e="${o.ge.e}"></i></div></div>`:o.l<3?`<p class="muted">Para crecer: ${why?esc(why):(C.dem[o.z]>0?'esperando su turno':'falta demanda de este tipo')}</p>`:''}`}
  const d=B[o.b];let h=`<h2>${d.ic} ${d.name}</h2><p class="muted">Nivel ${o.l}${d.max>1?' de '+d.max:''} · mantenimiento ${$$(d.up*(1+.3*(o.l-1)))}/min</p><div class="box">`;
  const m=1+.5*(o.l-1);if(d.power)h+=`<div class="line"><span>Genera</span><b>${fmt(d.power*m)} MW</b></div>`;if(d.water)h+=`<div class="line"><span>Bombea</span><b>${fmt(d.water*m)} m³</b></div>`;
  if(d.r)h+=`<div class="line"><span>Alcance</span><b>${d.r+o.l-1} casillas</b></div>`;if(d.tour)h+=`<div class="line"><span>Turismo</span><b>+${$$(d.tour)}/min</b></div>`;if(d.pol)h+=`<div class="line"><span>Contamina</span><b class="bad">sí</b></div>`;h+='</div>';
  if(o.busy)h+=`<div class="box"><p>${o.busy.kind==='build'?'En obra':'Ampliando a nivel '+(o.l+1)} · esperá <b data-end="${o.busy.e}"></b></p><div class="bar"><i data-s="${o.busy.s}" data-e="${o.busy.e}"></i></div><button class="btn blue" style="width:100%" data-act="speed" data-speed="${o.busy.e}">Terminar ya · <span></span></button></div>`;
  else if(o.l<d.max)h+=`<div class="box"><div class="line"><div><b>Ampliar a nivel ${o.l+1}</b><p class="muted">${d.power?'+50% de energía':d.water?'+50% de agua':'+1 de alcance'} · ⏱ ${dur(upTime(o))}</p></div><button class="btn" data-act="upgrade" data-cost="${upCost(o)}">${$$(upCost(o))}</button></div></div>`;
  return h}
function demBar(z,v,pop){const n=Math.max(-1,Math.min(1,v/Math.max(15,pop*.12))),col=`var(--${z})`;
  return `<div class="dem"><b style="color:${col}">${z}</b><div class="t"><i style="background:${col};${n>=0?`left:50%;width:${n*50}%`:`right:50%;width:${-n*50}%`}"></i></div></div>`}
function citySheet(){const C=CY,m=MS[S.ms],nx=MS[S.ms+1];
  let h=`<h2>🏙️ ${m[1]}</h2><p class="muted">${fmt(C.pop)} habitantes · ${fmt(C.jobs)} empleos</p>`;
  if(nx)h+=`<div class="bar"><i style="width:${Math.min(100,(C.pop-m[0])/(nx[0]-m[0])*100)}%"></i></div><p class="muted">Próximo hito: <b>${nx[1]}</b> con ${fmt(nx[0])} habitantes · bono ${$$(nx[2])}</p>`;
  S.bonus.forEach(k=>h+=`<div class="box"><div class="line"><span>🏆 Bono de ${MS[k][1]}</span><button class="btn gold sm" data-act="bonus">Cobrar ${$$(MS[k][2])}</button></div></div>`);
  h+=`<h3>Finanzas</h3><div class="box"><div class="line"><span>Impuestos</span><b class="ok">+${$$(C.income-C.tour)}/min</b></div>${C.tour?`<div class="line"><span>Turismo</span><b class="ok">+${$$(C.tour)}/min</b></div>`:''}<div class="line"><span>Mantenimiento</span><b class="bad">-${$$(C.cost)}/min</b></div><div class="line"><span>Neto</span><b class="${C.net>=0?'ok':'bad'}">${C.net>=0?'+':''}${$$(C.net)}/min</b></div>
   <div class="line" style="margin-top:6px"><span>Tasa de impuestos</span><div class="tax"><button class="btn ghost sm" data-act="tax" data-d="-1">−</button><b>${S.tax}%</b><button class="btn ghost sm" data-act="tax" data-d="1">+</button></div></div>
   <p class="muted">Más impuestos: más plata, menos demanda y felicidad. Con la app cerrada se recauda hasta 8 h.</p></div>
  <h3>Demanda</h3><div class="box">${demBar('R',C.dem.R,C.pop)}${demBar('C',C.dem.C,C.pop)}${demBar('I',C.dem.I,C.pop)}<p class="muted">Zonificá lo que tenga la barra hacia la derecha.</p></div>
  <h3>Servicios</h3><div class="box"><div class="line"><span>⚡ Electricidad</span><b class="${C.pr<1?'bad':''}">${fmt(C.pU)} / ${fmt(C.pS)} MW</b></div><div class="line"><span>💧 Agua</span><b class="${C.wr<1?'bad':''}">${fmt(C.wU)} / ${fmt(C.wS)} m³</b></div><div class="line"><span>😊 Felicidad</span><b>${Math.round(C.happy*100)}%</b></div><div class="line"><span>👷 Cuadrillas libres</span><b>${Math.max(0,crewsFree())} / ${C.crews}</b></div></div>
  <h3>Hitos</h3>`+MS.slice(1).map(([p,n,b],k)=>{const un=Object.values(B).filter(d=>d.unlock===p).map(d=>d.ic+' '+d.name).join(', ');return `<div class="ms ${S.ms>=k+1?'done':''}"><b>${S.ms>=k+1?'✅':'🏁'}</b><div><b>${n}</b> · ${fmt(p)} hab.<small class="muted" style="display:block">Bono ${$$(b)}${un?' · '+un:''}</small></div></div>`}).join('')+
  `<h3>Partida</h3><p class="muted">${host?'Se sincroniza con FUNVS y te avisa por Telegram aunque esté cerrado (si tenés el bot activado).':'Se guarda en este navegador. Abrilo desde FUNVS → Jugar para sincronizarlo y recibir avisos por Telegram.'}</p><button class="btn ghost sm" data-act="reset">Empezar una ciudad nueva</button>`;return h}
function avisosList(){const t=now(),L=[];S.t.forEach((x,i)=>{const o=x.o;if(!o)return;
    if(o.k==='b'&&o.busy){const d=B[o.b];L.push({k:'b'+i+o.busy.kind+o.l,at:o.busy.e,i:o.busy.kind==='build'?'🏗️':'⬆️',t:o.busy.kind==='build'?`¡${d.name} terminado!`:`Tu ${d.name} fue ampliado`,b:o.busy.kind==='build'?'Ya está funcionando':`Ahora es nivel ${o.l+1}`})}
    else if(o.k==='zone'&&o.ge&&o.l===2)L.push({k:'z'+i,at:o.ge.e,i:ZN[o.z].ic,t:`Se levanta una torre ${ZN[o.z].name.toLowerCase()}`,b:'Tu ciudad sigue creciendo'})});
  L.push({k:'cap',at:t+OFF_CAP,i:'💰',t:'Tu ciudad dejó de recaudar',b:'Pasaron 8 h: entrá para que vuelva a cobrar impuestos'});
  return L.sort((a,b)=>a.at-b.at).slice(0,25)}
function notifSheet(){const canN='Notification' in window,perm=canN?Notification.permission:'denied';
  let h=`<div class="line"><h2>Avisos</h2>${S.notifs.some(n=>!n.read)?'<button class="btn ghost sm" data-act="readall">Marcar leídos</button>':''}</div>`;
  if(!host&&canN&&perm==='default')h+=`<div class="box"><p>Recibí los avisos aunque estés en otra pestaña.</p><button class="btn" data-act="perm">Activar notificaciones</button></div>`;
  const up=avisosList().filter(a=>a.k!=='cap').slice(0,8);if(up.length)h+=`<h3>Próximamente</h3>`+up.map(u=>`<div class="nt"><span class="ti">${u.i}</span><div><b>${esc(u.t)}</b><small>en <span data-end="${u.at}"></span></small></div></div>`).join('');
  h+=`<h3>Historial</h3>`+(S.notifs.length?S.notifs.slice(0,30).map(n=>`<div class="nt ${n.read?'':'unread'}"><span class="ti">${n.icon}</span><div><b>${esc(n.title)}</b><small>${esc(n.body||'')} · ${rel(n.t)}</small></div></div>`).join(''):'<p class="muted">Sin avisos todavía.</p>');
  return h}
function render(){const sh=$('#sheet');if(!sheet){sh.classList.add('hidden')}else{const st=sh.scrollTop;sh.classList.remove('hidden');
    sh.innerHTML='<button class="x" data-act="close" aria-label="Cerrar">✕</button>'+(sheet==='tile'&&sel!=null?tileSheet():sheet==='city'?citySheet():notifSheet());sh.scrollTop=st;
    if(sheet==='notifs'&&S.notifs.some(n=>!n.read))setTimeout(()=>{S.notifs.forEach(n=>n.read=true);badges()},1500)}
  renderPalette();live();badges();dirty=false}
function badges(){const u=S.notifs.filter(n=>!n.read).length,nb=$('#nbadge');nb.textContent=u;nb.classList.toggle('hidden',!u);const cb=$('#cbadge');cb.textContent=S.bonus.length;cb.classList.toggle('hidden',!S.bonus.length)}
function live(){const C=CY,t=now();$('#money').textContent=$$(S.money);$('#money').classList.toggle('neg',S.money<0);
  const nt=$('#net');nt.textContent=(C.net>=0?'+':'')+$$(C.net)+'/min';nt.classList.toggle('neg',C.net<=-1);
  $('#pop').textContent=fmt(C.pop);$('#happy').textContent=Math.round(C.happy*100);
  const bar=(z,v)=>{const n=Math.max(-1,Math.min(1,v/Math.max(15,C.pop*.12)));return `<span style="display:flex;flex-direction:column;align-items:center"><i style="height:${Math.max(2,Math.abs(n)*18)}px;background:var(--${z});opacity:${n>0?1:.35}"></i><b>${z}</b></span>`};
  $('#sub').innerHTML=`<span class="rci">${bar('R',C.dem.R)}${bar('C',C.dem.C)}${bar('I',C.dem.I)}</span><span class="${C.pr<1?'bad':''}">⚡ ${fmt(C.pU)}/${fmt(C.pS)}</span><span class="${C.wr<1?'bad':''}">💧 ${fmt(C.wU)}/${fmt(C.wS)}</span><span>👷 ${Math.max(0,crewsFree())}/${C.crews}</span><span>🏁 ${MS[S.ms][1]}</span>`;
  const sh=$('#sheet');
  sh.querySelectorAll('[data-end]').forEach(e=>e.textContent=dur(+e.dataset.end-t));
  sh.querySelectorAll('[data-s]').forEach(e=>{const s=+e.dataset.s,en=+e.dataset.e;e.style.width=Math.min(100,(t-s)/(en-s)*100)+'%'});
  sh.querySelectorAll('[data-cost]').forEach(e=>e.disabled=S.money<+e.dataset.cost);
  sh.querySelectorAll('[data-speed]').forEach(e=>{const c=speedCost(+e.dataset.speed-t);e.querySelector('span').textContent=$$(c);e.disabled=S.money<c})}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.nav;if(k==='build'){closeSheet();return}if(sheet===k){closeSheet();return}sel=null;openSheet(k);render()}));
$('#bell').addEventListener('click',()=>{sel=null;openSheet('notifs');render()});
$('#sheet').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(el.dataset.act==='close'){closeSheet();return}act(el.dataset.act,el)});

/* ================= guardado: local + FUNVS (Gist → Telegram) ================= */
// Abierto dentro de FUNVS (Jugar → Ciudad), la partida viaja en db.barrio con el resto de la configuración.
// db.barrio.avisos lista lo que va a pasar (obras, ampliaciones, torres, tope de recaudación): GitHub la lee
// cada ~10 min (scripts/alertas.mjs) y manda el Telegram aunque FUNVS esté cerrado.
let lastSave=0,lastPush=0,pushT=null;
function hostPush(){pushT=null;if(!host)return;lastPush=now();try{const s=JSON.parse(JSON.stringify(S));s.notifs=s.notifs.slice(0,20);s.t.forEach(x=>delete x.nw);host.set({save:s,avisos:avisosList(),at:S.savedAt})}catch(e){}}
function save(force){const t=now();if(!force&&t-lastSave<3000)return;lastSave=t;S.savedAt=t;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(host&&(force||dirtyHost)){dirtyHost=false;clearTimeout(pushT);pushT=setTimeout(hostPush,force?1500:5000)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){dirtyHost=true;save(true)}else{catchUp();dirty=true}});
if(host){try{const h=host.get(),c=h&&h.save;if(c&&c.v===2&&(c.savedAt||0)>(S.savedAt||0)+5000)S=c}catch(e){}
  host.onChange(()=>{try{const h=host.get(),c=h&&h.save;if(c&&c.v===2&&(c.savedAt||0)>(S.savedAt||0)+5000){S=c;sel=null;catchUp();dirty=true}}catch(e){}});
  setInterval(()=>{if(now()-lastPush>10*60e3){dirtyHost=true;save(true)}},60e3)}

/* ================= arranque ================= */
resize();centerCam();catchUp();render();requestAnimationFrame(draw);
setInterval(()=>{const t=now();if(t-S.last>5000)catchUp();else step(t-S.last,t,true);if(dirty)render();else live();save()},250);
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Urbe · tu ciudad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: constructor de ciudad tranquilo, tipo Cities: Skylines en el celu
   IDEA: una maqueta 3D donde trazás calles con el dedo y plantás casas una por una
   PICTURE: el mapa 3D ocupa la pantalla; la cámara gira, se acerca y se mueve
   COLOUR and TYPE: pasto, asfalto, techos de tejas y cielo; Fredoka
   LAYOUT: datos arriba, mapa al medio, paleta abajo, hojas deslizables */
:root{color-scheme:light dark;--sky1:light-dark(#8fd0f7,#0b1428);--sky2:light-dark(#e3f4ff,#1c2a4c);--ink:light-dark(#1f2d45,#eef3ff);--card:light-dark(#fff,#18223d);--soft:light-dark(#eef4fa,#232f50);--muted:light-dark(#5f6f88,#9fadc9);--line:light-dark(#e1e8f0,#2f3b60);--acc:#2f7de1;--gold:#ffc83d;--red:#ff5a5a;--ok:#2fa84f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:16px/1.4 Fredoka,ui-rounded,system-ui,sans-serif;background:linear-gradient(var(--sky1),var(--sky2) 60%);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 4px}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:5px 10px;box-shadow:0 3px 0 rgba(0,0,0,.12);font-weight:600;white-space:nowrap;font-size:15px}
.pill small{color:var(--muted);font-weight:500;font-size:13px}
.money{flex:1 1 auto}.neg{color:var(--red)!important}
.bell{position:relative;flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--card);font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.12);cursor:pointer}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.hidden{display:none!important}
#sub{display:flex;gap:12px;padding:2px 12px 6px;font-size:13px;font-weight:500;color:light-dark(#173a63,#c8d6f5);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#stage{position:relative;flex:1 1 auto;min-height:220px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.fab{position:absolute;border:0;border-radius:14px;background:var(--card);box-shadow:0 3px 0 rgba(0,0,0,.15);font:600 18px Fredoka,system-ui;color:var(--ink);width:42px;height:42px;cursor:pointer;display:grid;place-items:center}
#rotL{right:10px;top:8px}#rotR{right:10px;top:56px}#zin{right:10px;top:112px}#zout{right:10px;top:160px}#tilt{right:10px;top:216px}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(20,30,50,.8);color:#fff;font-size:13px;padding:6px 12px;border-radius:12px;white-space:nowrap;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#palette{background:var(--card);box-shadow:0 -6px 18px rgba(0,0,0,.12);border-radius:20px 20px 0 0;padding:8px 0 4px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 10px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar,#sub::-webkit-scrollbar{display:none}
.cat{flex:none;border:0;border-radius:12px;padding:7px 11px;background:var(--soft);color:var(--ink);font:600 14px Fredoka,system-ui;cursor:pointer;min-height:38px}
.cat.on{background:#22304a;color:#fff}
.it{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;width:88px;border:2px solid transparent;border-radius:14px;padding:6px 4px;background:var(--soft);color:var(--ink);font:500 12px/1.15 Fredoka,system-ui;cursor:pointer;text-align:center}
.it .e{font-size:22px}.it small{color:var(--muted);font-size:11px}
.it.on{border-color:#22304a;background:light-dark(#fff,#2b3860)}.it.lk{opacity:.45}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{position:relative;flex:1;border:0;background:none;color:var(--muted);font:600 14px Fredoka,system-ui;padding:9px 0 11px;cursor:pointer;min-height:46px}
nav button.on{color:var(--ink)}nav button.on::after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:3px;background:var(--acc)}
nav .badge{top:4px;right:calc(50% - 44px)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.22);padding:14px 16px 16px;animation:up .22s ease-out;z-index:3}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.x{position:sticky;top:0;float:right;border:0;background:var(--soft);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;z-index:2}
.btn{border:0;border-radius:14px;padding:10px 14px;min-height:44px;font:600 15px Fredoka,system-ui;color:#fff;background:var(--ok);box-shadow:0 4px 0 #227a39;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #227a39}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 4px 0 #cf9411}
.btn.blue{background:var(--acc);box-shadow:0 4px 0 #2a5fa6}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px}
.btn:disabled{filter:grayscale(1);opacity:.45;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h2{margin:0 0 2px;font-size:22px;line-height:1.1;font-weight:600}
h3{margin:14px 0 6px;font-size:14px;color:var(--muted);font-weight:500}
p{margin:5px 0}.muted{color:var(--muted);font-size:14px}
.box{background:var(--soft);border-radius:16px;padding:12px;margin:8px 0}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}
.line b{white-space:nowrap}
.bar{height:10px;border-radius:9px;background:light-dark(#d6e0ec,#33406a);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:9px;transition:width .25s linear}
.ok{color:var(--ok)}.bad{color:var(--red)}
.tax{display:flex;align-items:center;gap:10px}.tax b{font-size:22px;min-width:52px;text-align:center}
.nt{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.nt .ti{font-size:22px}.nt small{display:block;color:var(--muted);font-size:13px}
.nt.unread b::after{content:" ●";color:var(--red);font-size:12px}
.ms{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.ms.done{opacity:.5}
#toasts{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:min(94vw,420px);display:flex;flex-direction:column;gap:6px;z-index:9;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:tin .3s ease-out;transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(-12px)}
.toast .ti{font-size:24px}.toast small{display:block;color:var(--muted);font-size:14px}
.toast.warn{border-left:5px solid var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(-16px)}}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;z-index:8;padding:16px}
.mbox{background:var(--card);border-radius:24px;padding:22px;width:min(100%,380px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mbox .btn{width:100%;margin-top:14px}
.list{text-align:left;margin:10px 0;padding:0;list-style:none;max-height:38vh;overflow:auto}
.list li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.big{font-size:26px;font-weight:700;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pill money">💰 <span id="money">0</span> <small id="net"></small></div>
    <div class="pill">👥 <span id="pop">0</span></div>
    <div class="pill">😊 <span id="happy">0</span>%</div>
    <button class="bell" id="bell" aria-label="Avisos">🔔<span class="badge hidden" id="nbadge"></span></button>
  </header>
  <div id="sub"></div>
  <main id="stage">
    <canvas id="cv"></canvas>
    <button class="fab" id="rotL" aria-label="Girar a la izquierda">⟲</button>
    <button class="fab" id="rotR" aria-label="Girar a la derecha">⟳</button>
    <button class="fab" id="zin" aria-label="Acercar">＋</button>
    <button class="fab" id="zout" aria-label="Alejar">－</button>
    <button class="fab" id="tilt" aria-label="Inclinar la cámara">📐</button>
    <div id="hint"></div>
    <section id="sheet" class="hidden"></section>
  </main>
  <div id="palette"><div class="strip" id="cats"></div><div class="strip" id="items"></div></div>
  <nav>
    <button data-nav="build" class="on">🛠️ Construir</button>
    <button data-nav="city">📊 Ciudad<span class="badge hidden" id="cbadge"></span></button>
    <button data-nav="notifs">🔔 Avisos</button>
  </nav>
</div>
<div id="toasts"></div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
<script>
{
/* ================= catálogo ================= */
const WH=400, KEY='urbe3d-v1', H2=2*3600e3, H8=8*3600e3, OFF_CAP=8*3600e3, FH=3.2;
const RW={calle:{name:'Calle',w:9,cost:8,unlock:0},avenida:{name:'Avenida',w:15,cost:20,unlock:100},ruta:{name:'Ruta',w:14,cost:0,unlock:1e9}};
const HM={
  casita:{name:'Casita',ic:'🏠',w:8,d:8,cost:800,build:30,cap:3,unlock:0,fl:1,roof:'gable',walls:['#f3e6cf','#f6d8b8','#e9eef2','#f1d1d1','#e3edd9'],roofs:['#c8553d','#9c4a3a','#5d6b7a','#b8663f']},
  chalet:{name:'Chalet',ic:'🏡',w:11,d:9,cost:2000,build:300,cap:4,unlock:0,fl:1,roof:'gable',chim:1,walls:['#fff4e0','#e8d9c0','#dfe8e0','#f0e2d6'],roofs:['#8b3a2b','#3e5566','#6b4a3a']},
  moderna:{name:'Casa moderna',ic:'🏘️',w:12,d:10,cost:5000,build:1800,cap:5,unlock:30,fl:2,roof:'modern',walls:['#f4f4f2','#e6e2da','#d9dee4'],roofs:['#6f7680']},
  duplex:{name:'Dúplex',ic:'🏘️',w:15,d:9,cost:9000,build:7200,cap:8,unlock:100,fl:2,roof:'gable',walls:['#efe3d0','#dfe6ee','#ead7cf'],roofs:['#7c4a3b','#4f5f70']},
  depto:{name:'Edificio',ic:'🏢',w:16,d:14,cost:25000,build:28800,cap:24,unlock:300,fl:5,roof:'flat',walls:['#e8dccb','#d8d2c6','#cfd8e2'],roofs:['#8a8f97']},
  torre:{name:'Torre',ic:'🏙️',w:18,d:18,cost:80000,build:28800,cap:70,unlock:700,fl:14,roof:'flat',walls:['#bcd3e8','#c9d1d9','#d6dde6'],roofs:['#7a8591']},
  plaza:{name:'Plaza',ic:'⛲',w:18,d:18,cost:1500,build:60,cap:0,unlock:30,plaza:1}
};
const MS=[[0,'Caserío',0],[30,'Barrio',3000],[100,'Pueblo',8000],[300,'Villa',20000],[700,'Ciudad',50000],[1500,'Gran ciudad',100000],[3000,'Metrópolis',200000]];
const CATS=[['ver','🔍 Ver'],['calles','🛣️ Calles'],['casas','🏠 Casas'],['deco','🌳 Verde'],['demoler','🚜 Demoler']];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>Date.now();
function fmt(n){n=Math.floor(Math.abs(n));if(n<1000)return ''+n;const u=['K','M','B'];let x=n,i=-1;while(x>=1000&&i<2){x/=1000;i++}return (x<10?x.toFixed(1):Math.floor(x))+u[i]}
const $$=n=>{const v=Math.floor(Math.abs(n));return (n<0&&v?'-$':'$')+fmt(v)};
function dur(ms){let s=Math.max(0,Math.ceil(ms/1000));if(s<60)return s+'s';let m=Math.floor(s/60);if(m<60)return m+'m '+(s%60)+'s';let h=Math.floor(m/60);if(h<24)return h+'h '+(m%60)+'m';return Math.floor(h/24)+'d '+(h%24)+'h'}
function rel(t){const s=(now()-t)/1000;if(s<60)return 'recién';if(s<3600)return 'hace '+Math.floor(s/60)+' min';if(s<86400)return 'hace '+Math.floor(s/3600)+' h';return 'hace '+Math.floor(s/86400)+' d'}

/* ================= geometría 2D (x,z) ================= */
const d2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const sub2=(a,b)=>[a[0]-b[0],a[1]-b[1]], add2=(a,b)=>[a[0]+b[0],a[1]+b[1]], mul2=(a,k)=>[a[0]*k,a[1]*k];
const nrm2=a=>{const l=Math.hypot(a[0],a[1])||1;return[a[0]/l,a[1]/l]};
function segDist(p,a,b){const ab=sub2(b,a),t=Math.max(0,Math.min(1,((p[0]-a[0])*ab[0]+(p[1]-a[1])*ab[1])/((ab[0]**2+ab[1]**2)||1)));const q=add2(a,mul2(ab,t));return{d:d2(p,q),t,q}}
function segInt(p,p2,q,q2){const r=sub2(p2,p),s=sub2(q2,q),den=r[0]*s[1]-r[1]*s[0];if(Math.abs(den)<1e-9)return null;const qp=sub2(q,p),t=(qp[0]*s[1]-qp[1]*s[0])/den,u=(qp[0]*r[1]-qp[1]*r[0])/den;if(t<=0||t>=1||u<0||u>1)return null;return{t,u,x:add2(p,mul2(r,t))}}
const plen=pts=>{let l=0;for(let i=1;i<pts.length;i++)l+=d2(pts[i-1],pts[i]);return l};
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function rect(x,z,a,w,d){const T=[Math.cos(a),Math.sin(a)],N=[-T[1],T[0]];return[[-1,-1],[1,-1],[1,1],[-1,1]].map(([u,v])=>[x+T[0]*u*w/2+N[0]*v*d/2,z+T[1]*u*w/2+N[1]*v*d/2])}
function rectsHit(A,B){for(const P of[A,B])for(let i=0;i<4;i++){const e=sub2(P[(i+1)%4],P[i]),ax=[-e[1],e[0]];let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
  for(const p of A){const v=p[0]*ax[0]+p[1]*ax[1];a0=Math.min(a0,v);a1=Math.max(a1,v)}for(const p of B){const v=p[0]*ax[0]+p[1]*ax[1];b0=Math.min(b0,v);b1=Math.max(b1,v)}if(a1<=b0||b1<=a0)return false}return true}
function rdp(pts,eps){if(pts.length<3)return pts.slice();let md=0,mi=0;for(let i=1;i<pts.length-1;i++){const d=segDist(pts[i],pts[0],pts[pts.length-1]).d;if(d>md){md=d;mi=i}}
  if(md>eps){const a=rdp(pts.slice(0,mi+1),eps),b=rdp(pts.slice(mi),eps);return a.slice(0,-1).concat(b)}return[pts[0],pts[pts.length-1]]}
function chaikin(p,n){for(let k=0;k<n;k++){if(p.length<3)return p;const o=[p[0]];for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];o.push(add2(mul2(a,.75),mul2(b,.25)),add2(mul2(a,.25),mul2(b,.75)))}o.push(p[p.length-1]);p=o}return p}
function resample(p,step){const o=[p[0]];let acc=0;for(let i=1;i<p.length;i++){let a=p[i-1];const b=p[i];let seg=d2(a,b);while(seg>1e-6&&acc+seg>=step){const t=(step-acc)/seg;a=add2(a,mul2(sub2(b,a),t));o.push(a);seg=d2(a,b);acc=0}acc+=seg}
  if(d2(o[o.length-1],p[p.length-1])>step*.35)o.push(p[p.length-1]);else o[o.length-1]=p[p.length-1];return o}

/* ================= estado ================= */
function genWorld(seed){let x=seed;const rnd=()=>(x=(x*16807)%2147483647)/2147483647;
  const lc=[60+rnd()*160,-260+rnd()*120],lake=[];for(let k=0;k<18;k++){const a=k/18*Math.PI*2,r=60+rnd()*35;lake.push([Math.round(lc[0]+Math.cos(a)*r*1.3),Math.round(lc[1]+Math.sin(a)*r)])}
  const trees=[];let tries=0;while(trees.length<420&&tries<8000){tries++;const p=[(rnd()*2-1)*(WH-8),(rnd()*2-1)*(WH-8)];if(inPoly(p,lake)||Math.abs(p[1]-40)<16&&p[0]<-180)continue;
    const c=Math.sin(p[0]*.012+seed%7)*Math.cos(p[1]*.014);if(c<.05&&rnd()<.8)continue;trees.push([Math.round(p[0]*10)/10,Math.round(p[1]*10)/10,+(0.8+rnd()*.6).toFixed(2)])}
  return{lake,trees}}
function fresh(){const t=now(),seed=1+Math.floor(Math.random()*2e9),w=genWorld(seed);
  const s={v:3,money:25000,tax:9,seed,lake:w.lake,trees:w.trees,nodes:{},roads:{},lots:[],nid:1,ms:0,bonus:[],notifs:[],flags:{},last:t,savedAt:0,cam:null};
  s.nodes.n0={x:-WH,z:40,e:1};s.nodes.n1={x:-250,z:40};s.roads.r0={a:'n0',b:'n1',t:'ruta',pts:resample([[-WH,40],[-250,40]],6)};
  s.notifs.push({id:'w',t,icon:'🏙️',title:'¡Bienvenido, intendente!',body:'Trazá calles desde la ruta y poné casas a los costados.',read:false});return s}
function load(){try{const j=localStorage.getItem(KEY);if(j){const s=JSON.parse(j);if(s&&s.v===3)return s}}catch(e){}return fresh()}
const host=(()=>{try{return window.parent!==window&&window.parent.BarrioHost||null}catch(e){return null}})();
let S=load(),tool='ver',cat='ver',sel=null,sheet=null,dirty=true,dirtyHost=false,catching=null,CY=null,resetArm=0,geoDirty=true;
const uid=p=>p+(S.nid++);

/* ================= red de calles ================= */
const roadW=r=>RW[r.t].w;
function nearestRoad(p,maxd=1e9,noRuta){let best=null;for(const id in S.roads){const r=S.roads[id];if(noRuta&&r.t==='ruta')continue;for(let i=0;i<r.pts.length-1;i++){const s=segDist(p,r.pts[i],r.pts[i+1]);if(s.d<maxd&&(!best||s.d<best.d))best={id,r,seg:i,q:s.q,d:s.d}}}return best}
function newNode(p){const id=uid('n');S.nodes[id]={x:+p[0].toFixed(2),z:+p[1].toFixed(2)};return id}
function mkRoad(a,b,pts,t){if(a===b&&plen(pts)<20)return;const c=[pts[0]];for(const p of pts.slice(1))if(d2(p,c[c.length-1])>.6)c.push(p);if(c.length<2||plen(c)<2)return;S.roads[uid('r')]={a,b,t,pts:c.map(p=>[+p[0].toFixed(2),+p[1].toFixed(2)])}}
function splitRoad(rid,seg,q){const r=S.roads[rid],A=S.nodes[r.a],Bn=S.nodes[r.b];
  if(d2(q,[A.x,A.z])<5)return r.a;if(d2(q,[Bn.x,Bn.z])<5)return r.b;
  const id=newNode(q),Q=[S.nodes[id].x,S.nodes[id].z];delete S.roads[rid];mkRoad(r.a,id,r.pts.slice(0,seg+1).concat([Q]),r.t);mkRoad(id,r.b,[Q].concat(r.pts.slice(seg+1)),r.t);return id}
function snapAt(p){let best=null;for(const id in S.nodes){const n=S.nodes[id],d=d2(p,[n.x,n.z]);if(d<9&&(!best||d<best.d))best={id,d}}if(best)return{node:best.id,p:[S.nodes[best.id].x,S.nodes[best.id].z]};
  const q=nearestRoad(p);if(q&&q.d<roadW(q.r)/2+5)return{road:q,p:q.q};return{p}}
function nodeAt(p){const s=snapAt(p);if(s.node)return s.node;if(s.road)return splitRoad(s.road.id,s.road.seg,s.road.q);return newNode(p)}
function roadPath(raw){let p=rdp(raw,2.5);const a=snapAt(p[0]).p,b=snapAt(p[p.length-1]).p;p[0]=a;p[p.length-1]=b;return resample(chaikin(p,3),4)}

  for(const q of p){if(Math.abs(q[0])>WH-4||Math.abs(q[1])>WH-4)return 'Se sale del mapa';if(inPoly(q,S.lake))return 'No se puede construir sobre el agua';
    for(const l of S.lots){if(d2(q,[l.x,l.z])<Math.max(HM[l.k].w,HM[l.k].d)/2+hw-1)return 'Hay una casa en el camino'}}
  if(plen(p)<12)return 'La calle es muy corta';return ''}

  S.money-=cost;let cur=p.slice(),start=nodeAt(cur[0]),guard=0;cur[0]=[S.nodes[start].x,S.nodes[start].z];const end=cur[cur.length-1];
  while(guard++<40){let hit=null,acc=0;

        if(x&&acc+x.t*sl>4&&(!hit||x.t<hit.t))hit={i,t:x.t,x:x.x,id,j}}}acc+=sl}

let conCache=null;

/* ================= casas ================= */
function lotRect(l){const m=HM[l.k];return rect(l.x,l.z,l.a,m.w,m.d)}

  else{for(const v of R.concat([c,mul2(add2(R[0],R[1]),.5)])){const r=nearestRoad(v,30);if(r&&r.d<roadW(r.r)/2+.6){why='Se pisa con la calle';break}}
    if(!why)for(const o of S.lots)if(rectsHit(R,lotRect(o))){why='Se pisa con otra construcción';break}}

function attach(){const con=(conCache=null,geoDirty=true,connected());for(const l of S.lots){const q=nearestRoad([l.x,l.z],HM[l.k].d/2+RW.avenida.w/2+8,true);l.con=!!(q&&con.has(q.id));l.val=lotValue(l)}geoDirty=false}

/* ================= simulación ================= */
function city(){if(geoDirty)attach();let pop=0,cap=0,vs=0,n=0,disc=0,plazas=0,len=0;
  for(const l of S.lots){if(l.k==='plaza'){if(!(l.busy&&l.busy.kind==='build'))plazas++;continue}if(l.busy&&l.busy.kind==='build')continue;pop+=l.res||0;cap+=capOf(l);vs+=l.val||0;n++;if(!l.con)disc++}
  for(const id in S.roads){const r=S.roads[id];if(r.t!=='ruta')len+=plen(r.pts)*RW[r.t].cost/8}
  const val=n?vs/n:0;let happy=.45+val*.4+(9-S.tax)*.03-(n?disc/n*.3:0);happy=Math.max(0,Math.min(1,happy));
  const income=pop*1.5*S.tax/9*(1+val*.5),cost=len*.004+plazas*2,crews=2+(pop>=100)+(pop>=700);
  return{pop:Math.floor(pop),cap,val,happy,income,cost,net:income-cost,crews,disc,len}}
function step(dt,T,earn){const C=CY=city();
  if(earn)S.money+=C.net*dt/60000;
  for(const l of S.lots){if(l.busy&&l.busy.e<=T){const m=HM[l.k],k=l.busy.kind;l.busy=null;geoDirty=dirty=dirtyHost=true;
      if(k==='build')notify(m.ic,`¡Tu ${m.name} está terminada!`,m.cap?(l.con?'Ya pueden mudarse los vecinos':'Conectala a la ruta para que se muden'):'Los vecinos de alrededor están más contentos');
      else{l.lvl++;notify('⬆️',`Tu ${m.name} fue ampliada`,`Nivel ${l.lvl}: ahora entran ${capOf(l)} personas`)}}
    if(l.busy&&l.busy.kind==='build'||!HM[l.k].cap)continue;
    const c=capOf(l),r=l.res||0;
    if(l.con&&r<c){l.res=Math.min(c,r+dt/60000*.5*(.4+C.happy));if(Math.floor(l.res)>Math.floor(r))dirtyHost=true}
    else if(!l.con&&r>0)l.res=Math.max(0,r-dt/60000*.3)}
  flag('disc',C.disc>0,'🚧','Hay casas sin conexión a la ruta','Uní su calle con la red para que lleguen vecinos');
  flag('red',S.money<0,'📉','La ciudad está en rojo','Subí impuestos o bajá gastos');
  while(S.ms+1<MS.length&&C.pop>=MS[S.ms+1][0]){S.ms++;const m=MS[S.ms];S.bonus.push(S.ms);dirty=dirtyHost=true;
    const un=[...Object.values(HM).filter(d=>d.unlock===m[0]).map(d=>d.name),...Object.values(RW).filter(d=>d.unlock===m[0]).map(d=>d.name)];
    notify('🏆',`¡Tu ciudad ya es ${m[1]}!`,`Cobrá el bono de ${$$(m[2])} en Ciudad`+(un.length?` · Nuevo: ${un.join(', ')}`:''))}

function flag(k,cond,ic,ti,b){if(cond&&!S.flags[k]){S.flags[k]=1;notify(ic,ti,b)}else if(!cond&&S.flags[k])S.flags[k]=0}
function catchUp(){const t=now(),away=t-(S.last||t);if(away<5000){step(Math.max(0,away),t,true);return}
  catching=[];const m0=S.money,p0=city().pop;let T=S.last;const st=away>120e3?Math.max(60e3,away/300):away;
  while(T<t){const dt=Math.min(st,t-T);T+=dt;step(dt,T,T-(t-away)<=OFF_CAP)}
  const ev=catching;catching=null;if(away>120e3)welcome(away,ev,S.money-m0,CY.pop-p0)}

/* ================= avisos ================= */

  if(catching){catching.push(n);return}toast(icon,title,body);
  try{if(!host&&'Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification(title,{body,tag:n.id})}catch(e){}}

  el.innerHTML=`<span class="ti">${icon}</span><div><b>${esc(title)}</b>${body?`<small>${esc(body)}</small>`:''}</div>`;

  <div class="big">${dm>=0?'+':''}${$$(dm)} · ${dp>=0?'+':'-'}${fmt(dp)} 👥</div>${items?`<ul class="list">${items}</ul>`:''}${ev.length>6?`<p class="muted">y ${ev.length-6} avisos más</p>`:''}<button class="btn" id="mok">Ver mi ciudad</button>`)}

const upCost=l=>Math.round(HM[l.k].cost*(l.lvl===1?.8:1.5)), upTime=l=>l.lvl===1?H2:H8;

  if(S.money<m.cost){warn('No alcanza la plata',`Necesitás ${$$(m.cost-S.money)} más`);return}
  S.money-=m.cost;const T=now(),l={id:uid('l'),k:c.lot.k,x:+c.lot.x.toFixed(2),z:+c.lot.z.toFixed(2),a:+c.lot.a.toFixed(4),lvl:1,res:0,wc:Math.floor(Math.random()*(m.walls?m.walls.length:1)),rc:Math.floor(Math.random()*(m.roofs?m.roofs.length:1)),busy:{kind:'build',s:T,e:T+m.build*1000}};
  S.lots.push(l);const R=lotRect(l);S.trees=S.trees.filter(t=>!(inPoly(t,R)||d2(t,[l.x,l.z])<Math.max(m.w,m.d)*.6));
  geoDirty=dirty=dirtyHost=true;toast('🏗️',`Construyendo ${m.name}`,`Lista en ${dur(m.build*1000)}`);save(true)}
function act(a,el){const T=now(),l=sel&&sel.lot;dirty=dirtyHost=true;
  if(a==='upgrade'&&l){if(crewsFree()<=0)return warn('No hay cuadrillas libres');const c=upCost(l);if(S.money<c)return warn('No alcanza la plata');S.money-=c;l.busy={kind:'up',s:T,e:T+upTime(l)};toast('🏗️',`Ampliando ${HM[l.k].name}`,`Esperá ${dur(upTime(l))} para esta mejora`)}
  else if(a==='speed'&&l&&l.busy){const c=speedCost(l.busy.e-T);if(S.money<c)return warn('No alcanza la plata');S.money-=c;l.busy.e=T;step(0,T,false)}

  else if(a==='readall')S.notifs.forEach(n=>n.read=true);
  else if(a==='reset'){if(T-resetArm>4000){resetArm=T;el.textContent='Tocá otra vez para confirmar';return}S=fresh();S.savedAt=now();closeSheet();homeCam();geoDirty=true;cars=[]}
  save(true)}

/* ================= motor 3D (canvas) ================= */
const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1;
let cam=S.cam||{x:-235,z:40,d:200,yaw:.8,pitch:.85};
function homeCam(){cam={x:-235,z:40,d:200,yaw:.8,pitch:.85}}
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr}
new ResizeObserver(resize).observe(cv);
let E,FV,RV,UV,FOC,night=false;const LIGHT=(()=>{const v=[-.45,1,-.35],l=Math.hypot(...v);return v.map(x=>x/l)})();

// caras 3D que después se ordenan por profundidad
let F=[];

function treeItem(p,s){return{tree:1,p,s,z:toCam([p[0],5*s,p[2]])[2]}}
function drawTree(t){const top=toCam([t.p[0],7*t.s,t.p[2]]),base=toCam([t.p[0],0,t.p[2]]);if(top[2]<=1||base[2]<=1)return;const a=proj(base),b=proj(top),r=3.3*t.s*FOC/top[2];if(r<.6||b[0]<-r||b[0]>W+r||b[1]<-r||a[1]>H+r)return;

function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]),lo=[],up=[];for(const p of P){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}for(const p of P.reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}return lo.slice(0,-1).concat(up.slice(0,-1))}

function carsTick(dt){const con=connected(),ids=[...con].filter(id=>S.roads[id]);const want=Math.min(40,(ids.length>1?3:0)+Math.floor((CY?CY.pop:0)/6));

function draw(ts){requestAnimationFrame(draw);if(ts-lastFrame<30||!W)return;const dt=Math.min(.1,(ts-lastFrame)/1000);lastFrame=ts;tnow=now();night=isDark();

  for(const id in deg){const n=S.nodes[id];if(n)disc([n.x,n.z],nodeW(id)/2+1.6,.08,shade('#c3c6cb',1))}
  for(const r of rs)ribbon(r.pts,roadW(r)/2,.12,shade(r.t==='ruta'?'#474c56':'#5a606b',1));
  for(const id in deg){const n=S.nodes[id];if(n&&deg[id]>1)disc([n.x,n.z],nodeW(id)/2,.12,shade('#5a606b',1))}
  if(cam.d<450)for(const r of rs){const p=r.pts.length>3?r.pts.slice(1,-1):r.pts;line3(p.map(q=>[q[0],.16,q[1]]),r.t==='calle'?'#ece7da':'#f4d35e',Math.max(.6,FOC/cam.d*.22),r.t==='calle'?[6,7]:null)}

    if((l.lvl||1)>=3&&HM[l.k].roof==='gable'){const pc=L2W(l,0,0,HM[l.k].d/2+3.2);fill3(rect(pc[0],pc[2],l.a,5.5,3.2).map(p=>[p[0],.16,p[1]]),shade('#5cc6ee',1),'#fff',1.2)}}
  for(const c of cars){const q=carPose(c);if(!q)continue;const o={x:q.p[0],z:q.p[1],a:q.a};F=[];boxL(o,-2.1,-1,4.2,2,.2,1.1,c.col,c.col);boxL(o,-1.1,-.85,2.2,1.7,1.3,.7,'#2d3b4d','#2d3b4d');F.sort((a,b)=>b.z-a.z).forEach(drawFace)}
  F=[];const items=[];

  if(ghost&&ghost.lot){const g0=F.length;houseFaces({...ghost.lot,lvl:1,wc:0,rc:0},true);for(let i=g0;i<F.length;i++)if(!F[i].tree)F[i].ghost=ghost.ok?1:2}

  if(ghost&&ghost.R)fill3(ghost.R.map(p=>[p[0],.3,p[1]]),null,ghost.ok?'#43e07a':'#ff5a5a',2.5);
  if(preview&&preview.length>1){const t=tool==='r:avenida'?'avenida':'calle',p=roadPath(preview),bad=checkPath(p,t);ribbon(p,RW[t].w/2,.25,bad?'rgba(255,90,90,.45)':'rgba(80,160,255,.45)');
    const end=p[p.length-1],sc=toCam([end[0],2,end[1]]);if(sc[2]>1){const s=proj(sc),cost=Math.round(plen(p)*RW[t].cost);label(s[0],s[1]-26,bad||`${Math.round(plen(p))} m · ${$$(cost)}`,bad||S.money<cost?'#d9433b':'#22304a')}

  for(const l of S.lots){if(!l.busy&&(l.con||!HM[l.k].cap))continue;const c=toCam([l.x,lotHeight(l)+5,l.z]);if(c[2]<=1)continue;const s=proj(c);
    if(l.busy){const p=Math.min(1,(tnow-l.busy.s)/(l.busy.e-l.busy.s)),w=64;ctx.fillStyle='rgba(20,30,50,.8)';rr(s[0]-w/2-4,s[1]-20,w+8,28,8);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(s[0]-w/2,s[1]+1,w,4);ctx.fillStyle='#5be37a';ctx.fillRect(s[0]-w/2,s[1]+1,w*p,4);

    else{ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🚧',s[0],s[1])}}

/* ================= toques: mover, pellizcar, girar, dibujar ================= */
const P=new Map();let g0=null,mode=null,raw=[];
const clampCam=()=>{cam.x=Math.max(-WH,Math.min(WH,cam.x));cam.z=Math.max(-WH,Math.min(WH,cam.z));cam.d=Math.max(30,Math.min(750,cam.d));cam.pitch=Math.max(.4,Math.min(1.35,cam.pitch))};
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function pickLot(sx,sy){const g=groundAt(sx,sy);let best=null;
  for(const l of S.lots){const m=HM[l.k],hit=g&&inPoly(g,rect(l.x,l.z,l.a,m.w+1,m.d+1)),c=toCam([l.x,lotHeight(l)*.55,l.z]);if(c[2]<=1)continue;const s=proj(c),sd=Math.hypot(s[0]-sx,s[1]-sy),r=Math.max(16,Math.max(m.w,m.d)*.5*FOC/c[2]);
    if(hit||sd<r){if(!best||c[2]<best.z)best={l,z:c[2]}}}return best&&best.l}
function plantTree(g){if(inPoly(g,S.lake)||Math.abs(g[0])>WH-3||Math.abs(g[1])>WH-3)return;const q=nearestRoad(g,20);if(q&&q.d<roadW(q.r)/2+2)return;if(S.lots.some(l=>inPoly(g,lotRect(l))))return;if(S.trees.some(t=>d2(t,g)<4.5))return;
  if(S.money<50)return warn('No alcanza la plata');S.money-=50;S.trees.push([+g[0].toFixed(1),+g[1].toFixed(1),+(0.8+Math.random()*.5).toFixed(2)]);geoDirty=dirty=dirtyHost=true}
function tapAt(sx,sy){setupCam();const g=groundAt(sx,sy);
  if(tool==='ver'){const l=pickLot(sx,sy);if(l){sel={lot:l};openSheet('tile');render();return}const q=g&&nearestRoad(g,12);if(q){sel={road:q.id};openSheet('tile');render();return}closeSheet();return}
  if(tool==='dozer'){const l=pickLot(sx,sy);if(l){S.lots=S.lots.filter(x=>x!==l);geoDirty=dirty=dirtyHost=true;toast('🚜',`${HM[l.k].name} demolida`);save(true);return}
    const q=g&&nearestRoad(g,10);if(q){removeRoad(q.id);save(true);return}if(g){const i=S.trees.findIndex(t=>d2(t,g)<5);if(i>=0){S.trees.splice(i,1);geoDirty=dirty=true;save(true)}}}}
cv.addEventListener('pointerdown',e=>{if(e.isPrimary)P.clear();try{cv.setPointerCapture(e.pointerId)}catch(x){}const p=pos(e);P.set(e.pointerId,p);setupCam();
  if(P.size===1){g0={p,cam:{...cam},g:groundAt(...p),moved:false};mode=tool.startsWith('r:')?'road':HM[tool]?'lot':tool==='arbol'?'tree':'pan';raw=[];
    if(e.button===2)mode='rot';
    if(mode==='road'&&g0.g){raw=[g0.g];preview=raw}if(mode==='lot'&&g0.g)ghost=candidate(g0.g,tool);if(mode==='tree'&&g0.g)plantTree(g0.g)}
  else if(P.size===2){preview=null;ghost=null;raw=[];const[a,b]=[...P.values()],m=[(a[0]+b[0])/2,(a[1]+b[1])/2];g0={two:1,d:Math.hypot(a[0]-b[0],a[1]-b[1]),ang:Math.atan2(b[1]-a[1],b[0]-a[0]),my:m[1],gm:groundAt(...m),cam:{...cam}};mode='two'}});

  if(mode==='two'&&P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),ang=Math.atan2(b[1]-a[1],b[0]-a[0]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    cam.d=g0.cam.d*g0.d/Math.max(20,d);cam.yaw=g0.cam.yaw-(ang-g0.ang);cam.x=g0.cam.x;cam.z=g0.cam.z;clampCam();setupCam();
    if(g0.gm){const g2=groundAt(...m);if(g2){cam.x+=g0.gm[0]-g2[0];cam.z+=g0.gm[1]-g2[1];clampCam()}}return}
  if(P.size!==1)return;if(Math.hypot(p[0]-g0.p[0],p[1]-g0.p[1])>6)g0.moved=true;
  if(mode==='rot'){cam.yaw=g0.cam.yaw-(p[0]-g0.p[0])*.008;cam.pitch=g0.cam.pitch+(p[1]-g0.p[1])*.005;clampCam();return}

  else if(mode==='tree'&&g)plantTree(g);
  else if(mode==='pan'&&g0.moved&&g0.g){cam.x=g0.cam.x;cam.z=g0.cam.z;setupCam();const g2=groundAt(...p);if(g2){cam.x=g0.cam.x-(g2[0]-g0.g[0]);cam.z=g0.cam.z-(g2[1]-g0.g[1]);clampCam()}}});

  if(cat==='deco')return[['arbol','🌳','Árbol','$50'],['plaza','⛲','Plaza',`${$$(HM.plaza.cost)}`,HM.plaza.unlock]];
  if(cat==='demoler')return[['dozer','🚜','Demoler','gratis']];return[]}

  $('#hint').textContent=HINTS[tool.startsWith('r:')?'road':HM[tool]?'lot':tool==='arbol'?'arbol':tool==='dozer'?'dozer':'ver']}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;const it=items();tool=cat==='ver'?'ver':(it.find(x=>x[0]===tool)?tool:it[0][0]);if(tool!=='ver')closeSheet();renderPalette()});
$('#items').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;const it=items().find(x=>x[0]===b.dataset.tool);if(it&&it[4]&&(CY||city()).pop<it[4]){warn(`${it[2]}: se desbloquea con ${fmt(it[4])} vecinos`);return}tool=b.dataset.tool;closeSheet();renderPalette()});

/* ================= hojas ================= */
function openSheet(k){sheet=k;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===(k==='tile'?'build':k)));dirty=true}
function closeSheet(){sheet=null;sel=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav==='build'));$('#sheet').classList.add('hidden')}
function stars(v){const n=1+Math.round(v*4);return '★'.repeat(n)+'☆'.repeat(5-n)}
function tileSheet(){if(sel.road){const r=S.roads[sel.road];if(!r)return '<p class="muted">Ya no existe.</p>';const con=connected().has(sel.road);
    return `<h2>🛣️ ${RW[r.t].name}</h2><p class="muted">${Math.round(plen(r.pts))} m · ${con?'conectada a la ruta':'<b class="bad">sin conexión a la ruta</b>'}</p>${r.t==='ruta'?'<p class="muted">Es la entrada de la ciudad: por acá llegan los vecinos.</p>':'<p class="muted">Para sacarla usá 🚜 Demoler.</p>'}`}
  const l=sel.lot;if(!S.lots.includes(l))return '<p class="muted">Ya no existe.</p>';const m=HM[l.k];
  let h=`<h2>${m.ic} ${m.name}</h2><p class="muted">${m.cap?`Nivel ${l.lvl} · ${Math.floor(l.res||0)} de ${capOf(l)} vecinos`:'Suma valor a las casas de alrededor (75 m)'}</p>`;
  if(m.cap)h+=`<div class="box"><div class="line"><span>Conexión a la ruta</span><b class="${l.con?'ok':'bad'}">${l.con?'Sí':'No'}</b></div><div class="line"><span>Valor de la zona</span><b>${stars(l.val||0)}</b></div><p class="muted">Suben el valor: árboles cerca, una plaza y vista al lago.</p></div>`;
  if(l.busy)h+=`<div class="box"><p>${l.busy.kind==='build'?'En obra':'Ampliando a nivel '+(l.lvl+1)} · esperá <b data-end="${l.busy.e}"></b></p><div class="bar"><i data-s="${l.busy.s}" data-e="${l.busy.e}"></i></div><button class="btn blue" style="width:100%" data-act="speed" data-speed="${l.busy.e}">Terminar ya · <span></span></button></div>`;
  else if(m.cap&&l.lvl<3)h+=`<div class="box"><div class="line"><div><b>Ampliar a nivel ${l.lvl+1}</b><p class="muted">${l.lvl===1?(m.roof==='gable'||m.roof==='modern'?'Cochera':'Un piso más'):(m.roof==='gable'?'Pileta':m.roof==='modern'?'Terraza':'Terraza y piso')} · ${capOf({...l,lvl:l.lvl+1})} vecinos · ⏱ ${dur(upTime(l))}</p></div><button class="btn" data-act="upgrade" data-cost="${upCost(l)}">${$$(upCost(l))}</button></div></div>`;
  return h+`<button class="btn ghost sm" data-act="demolish">🚜 Demoler</button>`}
function citySheet(){const C=CY,m=MS[S.ms],nx=MS[S.ms+1];
  let h=`<h2>🏙️ ${m[1]}</h2><p class="muted">${fmt(C.pop)} vecinos · lugar para ${fmt(C.cap)}</p>`;
  if(nx)h+=`<div class="bar"><i style="width:${Math.min(100,(C.pop-m[0])/(nx[0]-m[0])*100)}%"></i></div><p class="muted">Próximo: <b>${nx[1]}</b> con ${fmt(nx[0])} vecinos · bono ${$$(nx[2])}</p>`;
  S.bonus.forEach(k=>h+=`<div class="box"><div class="line"><span>🏆 Bono de ${MS[k][1]}</span><button class="btn gold sm" data-act="bonus">Cobrar ${$$(MS[k][2])}</button></div></div>`);
  h+=`<h3>Finanzas</h3><div class="box"><div class="line"><span>Impuestos</span><b class="ok">+${$$(C.income)}/min</b></div><div class="line"><span>Mantenimiento de calles y plazas</span><b class="bad">-${$$(C.cost)}/min</b></div><div class="line"><span>Neto</span><b class="${C.net>=0?'ok':'bad'}">${C.net>=0?'+':''}${$$(C.net)}/min</b></div>
   <div class="line" style="margin-top:6px"><span>Tasa de impuestos</span><div class="tax"><button class="btn ghost sm" data-act="tax" data-d="-1">−</button><b>${S.tax}%</b><button class="btn ghost sm" data-act="tax" data-d="1">+</button></div></div>
   <p class="muted">Más impuestos: más plata pero vecinos menos contentos (llegan más lento). Con la app cerrada se recauda hasta 8 h.</p></div>
  <h3>Barrio</h3><div class="box"><div class="line"><span>😊 Felicidad</span><b>${Math.round(C.happy*100)}%</b></div><div class="line"><span>🌳 Valor promedio</span><b>${stars(C.val)}</b></div><div class="line"><span>🚧 Casas sin conexión</span><b class="${C.disc?'bad':''}">${C.disc}</b></div><div class="line"><span>👷 Cuadrillas libres</span><b>${Math.max(0,crewsFree())} / ${C.crews}</b></div><div class="line"><span>🛣️ Calles</span><b>${fmt(Object.values(S.roads).filter(r=>r.t!=='ruta').reduce((a,r)=>a+plen(r.pts),0))} m</b></div></div>
  <h3>Hitos</h3>`+MS.slice(1).map(([p,n,b],k)=>{const un=[...Object.values(HM).filter(d=>d.unlock===p).map(d=>d.ic+' '+d.name),...Object.values(RW).filter(d=>d.unlock===p).map(d=>'🛣️ '+d.name)].join(', ');return `<div class="ms ${S.ms>=k+1?'done':''}"><b>${S.ms>=k+1?'✅':'🏁'}</b><div><b>${n}</b> · ${fmt(p)} vecinos<small class="muted" style="display:block">Bono ${$$(b)}${un?' · '+un:''}</small></div></div>`}).join('')+
  `<h3>Partida</h3><p class="muted">${host?'Se sincroniza con FUNVS y te avisa por Telegram aunque esté cerrado (si tenés el bot activado).':'Se guarda en este navegador. Abrilo desde FUNVS → Jugar para sincronizarlo y recibir avisos por Telegram.'}</p><button class="btn ghost sm" data-act="reset">Empezar una ciudad nueva</button>`;return h}
function avisosList(){const t=now(),L=[];for(const l of S.lots)if(l.busy){const m=HM[l.k];L.push({k:l.id+l.busy.kind+l.lvl,at:l.busy.e,i:l.busy.kind==='build'?m.ic:'⬆️',t:l.busy.kind==='build'?`¡Tu ${m.name} está terminada!`:`Tu ${m.name} fue ampliada`,b:l.busy.kind==='build'?'Ya pueden mudarse los vecinos':`Ahora es nivel ${l.lvl+1}`})}
  L.push({k:'cap',at:t+OFF_CAP,i:'💰',t:'Tu ciudad dejó de recaudar',b:'Pasaron 8 h: entrá para que vuelva a cobrar impuestos'});return L.sort((a,b)=>a.at-b.at).slice(0,25)}
function notifSheet(){const canN='Notification' in window,perm=canN?Notification.permission:'denied';
  let h=`<div class="line"><h2>Avisos</h2>${S.notifs.some(n=>!n.read)?'<button class="btn ghost sm" data-act="readall">Marcar leídos</button>':''}</div>`;
  if(!host&&canN&&perm==='default')h+=`<div class="box"><p>Recibí los avisos aunque estés en otra pestaña.</p><button class="btn" data-act="perm">Activar notificaciones</button></div>`;
  const up=avisosList().filter(a=>a.k!=='cap').slice(0,8);if(up.length)h+=`<h3>Próximamente</h3>`+up.map(u=>`<div class="nt"><span class="ti">${u.i}</span><div><b>${esc(u.t)}</b><small>en <span data-end="${u.at}"></span></small></div></div>`).join('');
  h+=`<h3>Historial</h3>`+(S.notifs.length?S.notifs.slice(0,30).map(n=>`<div class="nt ${n.read?'':'unread'}"><span class="ti">${n.icon}</span><div><b>${esc(n.title)}</b><small>${esc(n.body||'')} · ${rel(n.t)}</small></div></div>`).join(''):'<p class="muted">Sin avisos todavía.</p>');return h}
function render(){const sh=$('#sheet');if(!sheet||sheet==='tile'&&!sel){sh.classList.add('hidden')}else{const st=sh.scrollTop;sh.classList.remove('hidden');
    sh.innerHTML='<button class="x" data-act="close" aria-label="Cerrar">✕</button>'+(sheet==='tile'?tileSheet():sheet==='city'?citySheet():notifSheet());sh.scrollTop=st;
    if(sheet==='notifs'&&S.notifs.some(n=>!n.read))setTimeout(()=>{S.notifs.forEach(n=>n.read=true);badges()},1500)}
  renderPalette();live();badges();dirty=false}
function badges(){const u=S.notifs.filter(n=>!n.read).length,nb=$('#nbadge');nb.textContent=u;nb.classList.toggle('hidden',!u);const cb=$('#cbadge');cb.textContent=S.bonus.length;cb.classList.toggle('hidden',!S.bonus.length)}
function live(){const C=CY,t=now();$('#money').textContent=$$(S.money);$('#money').classList.toggle('neg',S.money<0);
  const nt=$('#net');nt.textContent=(C.net>=0?'+':'')+$$(C.net)+'/min';nt.classList.toggle('neg',C.net<=-1);
  $('#pop').textContent=fmt(C.pop);$('#happy').textContent=Math.round(C.happy*100);
  $('#sub').innerHTML=`<span>🏁 ${MS[S.ms][1]}</span><span>🏠 ${fmt(C.pop)}/${fmt(C.cap)} vecinos</span><span>👷 ${Math.max(0,crewsFree())}/${C.crews} cuadrillas</span>${C.disc?`<span class="bad">🚧 ${C.disc} sin conexión</span>`:''}`;
  const sh=$('#sheet');sh.querySelectorAll('[data-end]').forEach(e=>e.textContent=dur(+e.dataset.end-t));
  sh.querySelectorAll('[data-s]').forEach(e=>{const s=+e.dataset.s,en=+e.dataset.e;e.style.width=Math.min(100,(t-s)/(en-s)*100)+'%'});
  sh.querySelectorAll('[data-cost]').forEach(e=>e.disabled=S.money<+e.dataset.cost);
  sh.querySelectorAll('[data-speed]').forEach(e=>{const c=speedCost(+e.dataset.speed-t);e.querySelector('span').textContent=$$(c);e.disabled=S.money<c})}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.nav;if(k==='build'||sheet===k){closeSheet();return}sel=null;openSheet(k);render()}));
$('#bell').addEventListener('click',()=>{sel=null;openSheet('notifs');render()});
$('#sheet').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(el.dataset.act==='close'){closeSheet();return}act(el.dataset.act,el)});

/* ================= guardado: local + FUNVS (Gist → Telegram) ================= */
// Dentro de FUNVS (Jugar → Ciudad) la partida viaja en db.barrio. db.barrio.avisos lista lo que va a pasar
// (obras, ampliaciones, tope de recaudación): GitHub la lee cada ~10 min (scripts/alertas.mjs) y manda el Telegram.
let lastSave=0,lastPush=0,pushT=null;
function hostPush(){pushT=null;if(!host)return;lastPush=now();try{const s=JSON.parse(JSON.stringify(S));s.notifs=s.notifs.slice(0,20);s.lots.forEach(l=>{delete l.con;delete l.val});host.set({save:s,avisos:avisosList(),at:S.savedAt})}catch(e){}}
function save(force){const t=now();if(!force&&t-lastSave<3000)return;lastSave=t;S.savedAt=t;S.cam=cam;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(host&&(force||dirtyHost)){dirtyHost=false;clearTimeout(pushT);pushT=setTimeout(hostPush,force?1500:5000)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){dirtyHost=true;save(true)}else{catchUp();dirty=true}});
const adopt=c=>{S=c;sel=null;geoDirty=true;cars=[];if(S.cam)cam=S.cam};
if(host){try{const h=host.get(),c=h&&h.save;if(c&&c.v===3&&(c.savedAt||0)>(S.savedAt||0)+5000)adopt(c)}catch(e){}
  host.onChange(()=>{try{const h=host.get(),c=h&&h.save;if(c&&c.v===3&&(c.savedAt||0)>(S.savedAt||0)+5000){adopt(c);catchUp();dirty=true}}catch(e){}});
  setInterval(()=>{if(now()-lastPush>10*60e3){dirtyHost=true;save(true)}},60e3)}

/* ================= arranque ================= */
resize();catchUp();render();requestAnimationFrame(draw);
setInterval(()=>{const t=now();if(t-S.last>5000)catchUp();else step(t-S.last,t,true);if(dirty)render();else live();save()},250);
}
</script>
</body>

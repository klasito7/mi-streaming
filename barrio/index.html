<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Barrio Idle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: juguetón, de barrio, como un juego de celu tipo CityVille
   IDEA: una maqueta isométrica de barrio sobre una isla de tierra
   PICTURE: el barrio en canvas; los edificios crecen con cada nivel
   COLOUR and TYPE: cielo celeste, pasto verde, dorado de monedas; Fredoka
   LAYOUT: recursos arriba, barrio al medio, hoja de controles abajo */
:root{color-scheme:light dark;--sky1:light-dark(#79c6f6,#0e1830);--sky2:light-dark(#dff3ff,#24345c);--ink:light-dark(#22304a,#eef3ff);--card:light-dark(#fff,#18223d);--soft:light-dark(#eef5fb,#232f50);--muted:light-dark(#62718a,#9fadc9);--line:light-dark(#e2e9f1,#2f3b60);--gold:#ffc83d;--green:#38b955;--gem:#c24fd6;--red:#ff5a5a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:16px/1.4 Fredoka,ui-rounded,system-ui,sans-serif;background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:10px 10px 4px}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:4px 10px 4px 6px;box-shadow:0 3px 0 rgba(0,0,0,.12);font-weight:600;white-space:nowrap}
.pill small{color:var(--muted);font-weight:500;font-size:13px}
.coin{flex:1 1 auto}
.lvl{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 10px 4px 4px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.lvl b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#3d8bfd;color:#fff;font-size:14px}
.xp{width:46px;height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.xp i{display:block;height:100%;background:#3d8bfd;width:0}
.bell{position:relative;width:44px;height:44px;border:0;border-radius:50%;background:var(--card);font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.12);cursor:pointer}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.hidden{display:none!important}
#sub{display:flex;justify-content:space-between;padding:2px 14px;font-size:13px;color:light-dark(#1d3d63,#c8d6f5);font-weight:500}
#stage{position:relative;flex:1 1 auto;min-height:220px}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
#collectAll{position:absolute;right:12px;bottom:12px}
#panel{height:40dvh;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.14);overflow-y:auto;padding:16px 16px 10px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{position:relative;flex:1;border:0;background:none;color:var(--muted);font:600 14px Fredoka,system-ui;padding:10px 0 12px;cursor:pointer;min-height:48px}
nav button.on{color:var(--ink)}nav button.on::after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:3px;background:var(--green)}
nav .badge{top:4px;right:calc(50% - 46px)}
.btn{border:0;border-radius:14px;padding:11px 16px;min-height:44px;font:600 16px Fredoka,system-ui;color:#fff;background:var(--green);box-shadow:0 4px 0 #278a3f;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #278a3f}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 4px 0 #cf9411}
.btn.gem{background:var(--gem);box-shadow:0 4px 0 #8c2f9d}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:8px 12px;font-size:15px}
.btn:disabled{filter:grayscale(1);opacity:.45;cursor:default;transform:none}
.btn:focus-visible,nav button:focus-visible,.bell:focus-visible{outline:3px solid #3d8bfd;outline-offset:2px}
h2{margin:0;font-size:22px;line-height:1.1;font-weight:600}
h3{margin:16px 0 8px;font-size:15px;color:var(--muted);font-weight:500}
p{margin:6px 0}.muted{color:var(--muted);font-size:14px}
.phead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ico{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--c) 30%,var(--card));font-size:24px}
.ico.big{width:56px;height:56px;font-size:30px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.grow{flex:1}.grow small{display:block;color:var(--muted);font-size:13px}
.row.locked{opacity:.5}.lock{font-size:13px;color:var(--muted);white-space:nowrap}
.box{background:var(--soft);border-radius:16px;padding:12px;margin:10px 0}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:12px;border-radius:9px;background:light-dark(#d9e3ee,#33406a);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:9px;transition:width .25s linear}
.bar.gold i{background:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{background:var(--soft);border-radius:18px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:170px;justify-content:space-between}
.slot small{font-size:13px;color:var(--muted)}
.slot .btn{width:100%;padding:8px 4px;font-size:14px}
.chest{position:relative;width:58px;height:46px;margin-top:10px;border-radius:6px 6px 8px 8px;background:var(--cc);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.chest::before{content:"";position:absolute;left:-3px;right:-3px;top:-14px;height:20px;border-radius:12px 12px 4px 4px;background:var(--cc);filter:brightness(1.12);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);transform-origin:10% 100%;transition:transform .4s}
.chest::after{content:"";position:absolute;left:50%;top:0;width:12px;height:14px;margin-left:-6px;border-radius:3px;background:#ffd84d;box-shadow:0 0 0 2px #8a5a14}
.chest.madera{--cc:#b0763f}.chest.plata{--cc:#a9b6c6}.chest.oro{--cc:#f0b52e}
.chest.ready{animation:bob 1s ease-in-out infinite}
.chest.huge{width:110px;height:84px;margin:34px auto 10px}.chest.huge::before{top:-26px;height:36px}.chest.huge::after{width:20px;height:24px;margin-left:-10px}
.chest.shake{animation:shake .15s linear infinite}
.chest.open::before{transform:rotate(-38deg) translateY(-8px)}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes shake{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
#toasts{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:min(94vw,420px);display:flex;flex-direction:column;gap:6px;z-index:9;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:tin .3s ease-out;transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(-12px)}
.toast .ti{font-size:24px}.toast small{display:block;color:var(--muted);font-size:14px}
.toast.warn{border-left:5px solid var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(-16px)}}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;z-index:8;padding:16px}
.mbox{background:var(--card);border-radius:24px;padding:22px;width:min(100%,380px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mbox .btn{width:100%;margin-top:14px}
.rew{display:flex;justify-content:center;gap:12px;margin:12px 0;flex-wrap:wrap}
.rew span{background:var(--soft);border-radius:14px;padding:8px 14px;font-weight:600;font-size:20px;animation:pop .4s ease-out backwards}
.rew span:nth-child(2){animation-delay:.15s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.list{text-align:left;margin:10px 0;padding:0;list-style:none;max-height:40vh;overflow:auto}
.list li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.nt{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.nt .ti{font-size:22px}.nt small{display:block;color:var(--muted);font-size:13px}
.nt.unread b::after{content:" ●";color:var(--red);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pill coin">🪙 <span id="coins">0</span> <small id="rate"></small></div>
    <div class="pill">💎 <span id="gems">0</span></div>
    <div class="lvl"><b id="lvl">1</b><div class="xp"><i id="xp"></i></div></div>
    <button class="bell" id="bell" aria-label="Avisos">🔔<span class="badge hidden" id="nbadge"></span></button>
  </header>
  <div id="sub"><span id="workers"></span><span id="savehint"></span></div>
  <main id="stage"><canvas id="cv"></canvas><button class="btn gold hidden" id="collectAll">Recolectar todo</button></main>
  <section id="panel"></section>
  <nav>
    <button data-tab="city" class="on">🏙️ Barrio</button>
    <button data-tab="chests">🎁 Cofres<span class="badge hidden" id="cbadge"></span></button>
    <button data-tab="notifs">🔔 Avisos</button>
  </nav>
</div>
<div id="toasts"></div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
<script>
{
const N=6, CAP_MIN=180, CHEST_EVERY=3*3600e3, MAXT=8*3600e3, KEY='barrio-idle-v1';
const T={
  kiosco:{name:'Kiosco',emoji:'🏪',cost:30,prod:2,build:10,color:'#ef6b6b',roof:'flat',unlock:1},
  panaderia:{name:'Panadería',emoji:'🥐',cost:150,prod:6,build:60,color:'#f2b45a',roof:'pyr',rc:'#b4532a',unlock:1},
  plaza:{name:'Plaza',emoji:'🌳',cost:120,prod:0,build:30,color:'#5fb85a',unlock:2,max:5},
  verduleria:{name:'Verdulería',emoji:'🥬',cost:450,prod:14,build:180,color:'#62c27a',roof:'flat',unlock:2},
  parrilla:{name:'Parrilla',emoji:'🥩',cost:1300,prod:32,build:600,color:'#c9733e',roof:'pyr',rc:'#6b3a22',unlock:3},
  club:{name:'Club de barrio',emoji:'⚽',cost:4000,prod:80,build:1800,color:'#3b7dd8',roof:'flat',unlock:5},
  cine:{name:'Cine',emoji:'🎬',cost:12000,prod:200,build:3600,color:'#8f63d9',roof:'flat',unlock:7},
  torre:{name:'Torre de oficinas',emoji:'🏢',cost:40000,prod:550,build:7200,color:'#7d8fa6',roof:'flat',unlock:9,tall:1.6}
};
const CH={
  madera:{name:'Cofre de madera',time:15*60e3,min:60,mins:20,gems:[1,2]},
  plata:{name:'Cofre de plata',time:3*3600e3,min:400,mins:90,gems:[3,6]},
  oro:{name:'Cofre de oro',time:8*3600e3,min:2000,mins:300,gems:[10,18]}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>Date.now();
function fmt(n){n=Math.floor(n);if(n<1000)return ''+n;const u=['K','M','B','T'];let x=n,i=-1;while(x>=1000&&i<3){x/=1000;i++}return (x<10?x.toFixed(1):Math.floor(x))+u[i]}
function dur(ms){let s=Math.max(0,Math.ceil(ms/1000));if(s<60)return s+'s';let m=Math.floor(s/60);if(m<60)return m+'m '+(s%60)+'s';let h=Math.floor(m/60);if(h<24)return h+'h '+(m%60)+'m';return Math.floor(h/24)+'d '+(h%24)+'h'}
function rel(t){const s=(now()-t)/1000;if(s<60)return 'recién';if(s<3600)return 'hace '+Math.floor(s/60)+' min';if(s<86400)return 'hace '+Math.floor(s/3600)+' h';return 'hace '+Math.floor(s/86400)+' d'}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

function fresh(){const t=now();const s={v:1,coins:80,gems:10,xp:0,level:1,tiles:Array(N*N).fill(null),chests:[{type:'madera',end:null},null,null],nextChest:t+CHEST_EVERY,notifs:[],last:t,savedAt:0};
  s.tiles[14]={t:'kiosco',lvl:1,busy:null,stored:6,last:t,full:false};
  s.notifs.push({id:'w',t,icon:'👋',title:'¡Bienvenido al barrio!',body:'Tocá un terreno vacío para construir.',read:false});return s}
function load(){try{const j=localStorage.getItem(KEY);if(j){const s=JSON.parse(j);if(s&&s.v===1)return s}}catch(e){}return fresh()}
const host=(()=>{try{return window.parent!==window&&window.parent.BarrioHost||null}catch(e){return null}})();
let S=load(), sel=null, tab='city', dirty=true, dirtyHost=false, catching=null, gained=0, resetArm=0;

/* ---------- reglas ---------- */
const maxLvl=b=>T[b.t].max||10;
const need=L=>Math.round(60*1.55**(L-1));
const workers=()=>2+(S.level>=6)+(S.level>=12);
const busyCount=()=>S.tiles.filter(b=>b&&b.busy).length;
const freeWorkers=()=>workers()-busyCount();
const countOf=k=>S.tiles.filter(b=>b&&b.t===k).length;
const costOf=k=>Math.round(T[k].cost*1.35**countOf(k));
const upCost=b=>Math.round(T[b.t].cost*1.9**b.lvl);
const upTime=b=>Math.min(MAXT,T[b.t].build*1000*3**b.lvl);
const gemCost=ms=>Math.max(1,Math.ceil(ms/600000));
const plazaBonus=b=>.10+.05*b.lvl;
const baseRate=(k,l)=>T[k].prod*l*1.12**(l-1);
function neigh(i){const r=Math.floor(i/N),c=i%N,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)o.push(rr*N+cc)}return o}
function bonusOf(i){let s=0;for(const j of neigh(i)){const p=S.tiles[j];if(p&&p.t==='plaza'&&!(p.busy&&p.busy.kind==='build'))s+=plazaBonus(p)}return s}
function rateOf(i,lvl){const b=S.tiles[i];if(!b||!T[b.t].prod||(b.busy&&b.busy.kind==='build'))return 0;return baseRate(b.t,lvl||b.lvl)*(1+bonusOf(i))}
const totalRate=()=>S.tiles.reduce((a,_,i)=>a+rateOf(i),0);

/* ---------- avisos ---------- */
function notify(icon,title,body){const n={id:Math.random().toString(36).slice(2),t:now(),icon,title,body,read:false};S.notifs.unshift(n);if(S.notifs.length>60)S.notifs.length=60;dirty=true;
  if(catching){catching.push(n);return}
  toast(icon,title,body);
  try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification(title,{body,tag:n.id})}catch(e){}}
function toast(icon,title,body,kind){const box=$('#toasts'),el=document.createElement('div');el.className='toast '+(kind||'');
  el.innerHTML=`<span class="ti">${icon}</span><div><b>${esc(title)}</b>${body?`<small>${esc(body)}</small>`:''}</div>`;
  box.prepend(el);while(box.children.length>3)box.lastChild.remove();setTimeout(()=>el.classList.add('out'),3200);setTimeout(()=>el.remove(),3700)}

/* ---------- simulación ---------- */
function produce(i,a,b){const bd=S.tiles[i];if(b<=a)return;const r=rateOf(i);if(r<=0)return;const cap=r*CAP_MIN,before=bd.stored;
  bd.stored=Math.min(cap,bd.stored+r*(b-a)/60000);if(catching)gained+=Math.max(0,bd.stored-before);
  if(bd.stored>=cap-1e-6&&!bd.full){bd.full=true;notify('📦',`Tu ${T[bd.t].name} está lleno`,'Recolectá para que siga produciendo')}}
function complete(i){dirtyHost=true;const b=S.tiles[i],d=T[b.t],k=b.busy.kind,xp=b.busy.xp||5;b.busy=null;
  if(k==='build')notify(d.emoji,`¡${d.name} construido!`,d.prod?'Ya empezó a producir monedas':'Ya da bonus a sus vecinos');
  else{b.lvl++;notify('⬆️',`Tu ${d.name} ha sido mejorado`,d.prod?`Nivel ${b.lvl} · ahora produce ${fmt(rateOf(i))}/min`:`Nivel ${b.lvl} · bonus +${Math.round(plazaBonus(b)*100)}%`)}
  gainXP(xp);dirty=true}
function gainXP(x){S.xp+=x;while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;const g=3+S.level;S.gems+=g;
  const un=Object.values(T).filter(d=>d.unlock===S.level).map(d=>d.name);
  notify('🎉',`¡Subiste a nivel ${S.level}!`,`+${g} 💎`+(un.length?` · Desbloqueaste: ${un.join(', ')}`:'')+(S.level===6||S.level===12?' · ¡Nuevo obrero!':''));
  const ty=S.level%5===0?'oro':'plata';if(addChest(ty))notify('🎁',`Ganaste un ${CH[ty].name}`,'Andá a Cofres para abrirlo')}}
function addChest(ty){const i=S.chests.findIndex(c=>!c);if(i<0)return false;S.chests[i]={type:ty,end:null};dirty=true;return true}
function rollChest(){const r=Math.random();return r<.1?'oro':r<.4?'plata':'madera'}
function tick(){const t=now();
  S.tiles.forEach((b,i)=>{if(!b)return;let from=b.last||t;
    if(b.busy&&b.busy.end<=t){if(b.busy.kind==='up')produce(i,from,b.busy.end);from=Math.max(from,b.busy.end);complete(i)}
    if(!(b.busy&&b.busy.kind==='build'))produce(i,from,t);b.last=t});
  S.chests.forEach(c=>{if(c&&c.end&&c.end<=t&&!c.told){c.told=true;notify('🔓',`¡Tu ${CH[c.type].name} está listo!`,'Tocá para abrirlo')}});
  if(t>=S.nextChest){const ty=rollChest();if(addChest(ty)){S.nextChest=t+CHEST_EVERY;notify('🎁',`¡Llegó un ${CH[ty].name} gratis!`,'Empezá a abrirlo en Cofres')}}
  S.last=t}
function catchUp(){const away=now()-(S.last||now());catching=[];gained=0;tick();const ev=catching;catching=null;
  if(away>120e3&&(gained>=1||ev.length))welcome(away,ev)}

/* ---------- acciones ---------- */
function noWorkers(){const ends=S.tiles.filter(b=>b&&b.busy).map(b=>b.busy.end);toast('👷','Todos los obreros están ocupados',`Se libera uno en ${dur(Math.min(...ends)-now())}`,'warn')}
function collect(i,silent){dirtyHost=true;const b=S.tiles[i];const a=Math.floor(b.stored);if(a<1)return 0;S.coins+=a;b.stored-=a;b.full=false;
  const p=centers[i];if(p)floats.push({x:p.x,y:p.y-TW*.6,tx:'+'+fmt(a),t:now()});
  gainXP(Math.max(1,Math.round(Math.sqrt(a)/4)));
  if(!silent&&Math.random()<.03&&addChest('madera'))notify('🎁','¡Encontraste un cofre!','Un vecino dejó un Cofre de madera');
  dirty=true;return a}
function act(a,el){dirtyHost=true;const t=now(),b=sel!=null?S.tiles[sel]:null;
  if(a==='build'){const k=el.dataset.type,c=costOf(k);if(b)return;if(S.coins<c)return toast('🪙','Te faltan monedas',`Necesitás ${fmt(c-S.coins)} más`,'warn');if(freeWorkers()<=0)return noWorkers();
    S.coins-=c;S.tiles[sel]={t:k,lvl:1,busy:{kind:'build',start:t,end:t+T[k].build*1000,xp:Math.max(5,Math.round(c/8))},stored:0,last:t,full:false};
    toast('🔨',`Construyendo ${T[k].name}`,`Listo en ${dur(T[k].build*1000)}`)}
  else if(a==='upgrade'&&b){const c=upCost(b);if(S.coins<c)return toast('🪙','Te faltan monedas',`Necesitás ${fmt(c-S.coins)} más`,'warn');if(freeWorkers()<=0)return noWorkers();
    S.coins-=c;b.busy={kind:'up',start:t,end:t+upTime(b),xp:Math.round(c/8)};toast('🏗️',`Mejorando ${T[b.t].name}`,`Esperá ${dur(upTime(b))} para esta mejora`)}
  else if(a==='speed'&&b&&b.busy){const g=gemCost(b.busy.end-t);if(S.gems<g)return toast('💎','Te faltan gemas','Conseguilas en cofres y subiendo de nivel','warn');S.gems-=g;b.busy.end=t;tick()}
  else if(a==='collect'&&b)collect(sel);
  else if(a==='chest-start'){const c=S.chests[+el.dataset.i];if(S.chests.some(x=>x&&x.end&&x.end>t))return toast('⏳','Ya hay un cofre abriéndose','Uno por vez','warn');c.end=t+CH[c.type].time;toast('🔐',`Abriendo ${CH[c.type].name}`,`Listo en ${dur(CH[c.type].time)}`)}

/* ---------- canvas ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,TW=60,TH=30,ox=0,oy=0,dpr=1,centers=[],hits=[],floats=[];
function isDark(){const t=document.documentElement.dataset.theme;if(t)return t==='dark';return matchMedia('(prefers-color-scheme: dark)').matches}
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;
  TW=Math.min(W*.94/N,H/4.4);TH=TW/2;ox=W/2;const ch=TW*1.05+N*TH+TW*.35;oy=(H-ch)/2+TW*1.05}
const ro=new ResizeObserver(resize);ro.observe(cv);
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;if(f<0){r*=1+f;g*=1+f;b*=1+f}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}return `rgb(${r|0},${g|0},${b|0})`}

const dia=(x,y,hw,hh)=>[[x,y-hh],[x+hw,y],[x,y+hh],[x-hw,y]];

function rrect(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fillStyle=fill;ctx.fill()}
function drawBuilding(i,cx,cy,b,t,night){const d=T[b.t],k=.74,hw=TW/2*k,hh=TH/2*k,building=b.busy&&b.busy.kind==='build';let top;
  poly(dia(cx+TW*.05,cy+TW*.02,hw*1.08,hh*1.08),'rgba(0,0,0,.16)');
  if(b.t==='plaza'){poly(dia(cx,cy,hw,hh),night?'#2c6a3b':'#8fd67a',night?'#1f4f2b':'#6cb85c',2);
    if(building){emo('🚧',cx,cy-TW*.08,TW*.32)}else{emo('🌳',cx-hw*.45,cy-TW*.12,TW*.3);emo('🌳',cx+hw*.45,cy-TW*.12,TW*.3);emo(b.lvl>=3?'⛲':'🪑',cx,cy-TW*.04+hh*.3,TW*.28)}
    top=cy-TW*.3}
  else{const Hh=building?TW*.2:TW*(.3+.06*b.lvl)*(d.tall||1),col=building?'#bdb5a8':d.color;
    const L=[[cx-hw,cy],[cx,cy+hh],[cx,cy+hh-Hh],[cx-hw,cy-Hh]],R=[[cx,cy+hh],[cx+hw,cy],[cx+hw,cy-Hh],[cx,cy+hh-Hh]],Tp=dia(cx,cy-Hh,hw,hh);

    const quad=(f,u1,u2,v1,v2,c)=>poly([fp(f,u1,v1),fp(f,u2,v1),fp(f,u2,v2),fp(f,u1,v2)],c);
    if(building){ctx.strokeStyle='#8a6b3d';ctx.lineWidth=1.5;for(const f of[0,1]){ctx.beginPath();const a=fp(f,0,0),bb=fp(f,1,1),c2=fp(f,0,1),d2=fp(f,1,0);ctx.moveTo(...a);ctx.lineTo(...bb);ctx.moveTo(...c2);ctx.lineTo(...d2);ctx.stroke()}}
    else{const fl=Math.min(6,1+Math.floor(b.lvl/2)*(d.tall?2:1)),win=night?'#ffd76a':'rgba(214,238,255,.95)',rh=.62/fl;
      for(let f=0;f<fl;f++){const v1=.3+f*rh+rh*.18,v2=v1+rh*.58;for(const face of[0,1]){quad(face,.18,.42,v1,v2,win);quad(face,.58,.82,v1,v2,win)}}
      quad(0,.4,.62,0,.22,shade(col,-.55));quad(1,.1,.9,.22,.27,'rgba(255,255,255,.55)')}
    if(d.roof==='pyr'&&!building){const ap=[cx,cy-Hh-TW*.3];poly(Tp,shade(d.rc,-.2));poly([Tp[3],Tp[2],ap],shade(d.rc,-.08));poly([Tp[2],Tp[1],ap],d.rc);top=ap[1]}

  if(!building&&b.lvl>1){const px=cx+hw*.82,py=cy-hh*.1;ctx.beginPath();ctx.arc(px,py,TW*.1,0,7);ctx.fillStyle='#22304a';ctx.fill();ctx.fillStyle='#fff';ctx.font=`600 ${TW*.13}px Fredoka,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.lvl,px,py+1)}
  if(b.busy){const w=TW*.78,x=cx-w/2,y=top-TW*.42,p=Math.min(1,(t-b.busy.start)/(b.busy.end-b.busy.start));
    rrect(x-2,y-TW*.2,w+4,TW*.32,8,'rgba(20,30,50,.75)');rrect(x+2,y+TW*.02,(w-4),TW*.06,4,'rgba(255,255,255,.25)');rrect(x+2,y+TW*.02,(w-4)*p,TW*.06,4,'#5be37a');
    ctx.fillStyle='#fff';ctx.font=`600 ${Math.max(10,TW*.14)}px Fredoka,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((b.busy.kind==='up'?'⬆ ':'')+dur(b.busy.end-t),cx,y-TW*.07);top=y-TW*.2}
  else if(T[b.t].prod&&b.stored>=Math.max(1,rateOf(i))){const bob=Math.sin(t/280+i)*TW*.04,r=TW*.15,bx=cx,by=top-TW*.38+bob;
    ctx.beginPath();ctx.arc(bx,by,r,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=b.full?'#ff5a5a':'#ffc83d';ctx.stroke();emo('🪙',bx,by+1,r*1.2);top=by-r}
  hits.push({i,x1:cx-hw,x2:cx+hw,y1:top,y2:cy+hh})}
function draw(){const t=now(),night=isDark();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);hits=[];
  const D=TW*.35,Lc=[ox-N*TW/2,oy+N*TH/2],Bc=[ox,oy+N*TH],Rc=[ox+N*TW/2,oy+N*TH/2];
  poly([Lc,Bc,[Bc[0],Bc[1]+D],[Lc[0],Lc[1]+D]],night?'#6b4a32':'#b07b4f');poly([Bc,Rc,[Rc[0],Rc[1]+D],[Bc[0],Bc[1]+D]],night?'#56391f':'#8f5f3a');
  poly([Lc,Bc,[Bc[0],Bc[1]+D*.25],[Lc[0],Lc[1]+D*.25]],night?'#2f6b37':'#5fae4e');poly([Bc,Rc,[Rc[0],Rc[1]+D*.25],[Bc[0],Bc[1]+D*.25]],night?'#285c30':'#529d43');
  for(let s=0;s<2*N-1;s++)for(let r=0;r<N;r++){const c=s-r;if(c<0||c>=N)continue;const i=r*N+c,cx=ox+(c-r)*TW/2,cy=oy+(c+r+1)*TH/2;centers[i]={x:cx,y:cy};
    const g=(r+c)%2?(night?'#3a7f45':'#86cf6f'):(night?'#357540':'#7cc666');poly(dia(cx,cy,TW/2,TH/2),g,night?'rgba(0,0,0,.15)':'rgba(255,255,255,.18)');

  floats=floats.filter(f=>t-f.t<1200);for(const f of floats){const k=(t-f.t)/1200;ctx.globalAlpha=1-k;ctx.font=`700 ${TW*.24}px Fredoka,sans-serif`;ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#5a3b00';ctx.strokeText(f.tx,f.x,f.y-k*TW*.6);ctx.fillStyle='#ffd84d';ctx.fillText(f.tx,f.x,f.y-k*TW*.6);ctx.globalAlpha=1}

cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let hit=null;

/* ---------- guardado: local + FUNVS (Gist sincronizado → avisos por Telegram) ---------- */
// Abierto dentro de FUNVS (Jugar → Barrio), la partida viaja en db.barrio con el resto de tu configuración.
// db.barrio.avisos es la lista de lo que va a pasar (mejoras, cofres, depósitos llenos): GitHub la lee
// cada ~10 min (scripts/alertas.mjs) y te manda el Telegram aunque FUNVS esté cerrado.
let lastSave=0,lastPush=0,pushT=null;
function avisosList(){const t=now(),L=[];S.tiles.forEach((b,i)=>{if(!b)return;const d=T[b.t];
    if(b.busy)L.push({k:'b'+i+b.busy.kind+b.lvl,at:b.busy.end,i:b.busy.kind==='build'?'🔨':'⬆️',t:b.busy.kind==='build'?`¡${d.name} construido!`:`Tu ${d.name} ha sido mejorado`,b:b.busy.kind==='build'?'Ya empezó a producir monedas':`Ahora es nivel ${b.lvl+1}`});
    else{const r=rateOf(i);if(r>0&&!b.full)L.push({k:'f'+i,at:Math.round(t+(r*CAP_MIN-b.stored)/r*60000),i:'📦',t:`Tu ${d.name} está lleno`,b:'Entrá a recolectar para que siga produciendo'})}});
  S.chests.forEach((c,j)=>{if(c&&c.end&&c.end>t)L.push({k:'c'+j+c.type,at:c.end,i:'🔓',t:`¡Tu ${CH[c.type].name} está listo!`,b:'Entrá a abrirlo'})});
  if(S.chests.some(c=>!c))L.push({k:'g',at:S.nextChest,i:'🎁',t:'Llegó un cofre gratis',b:'Empezá a abrirlo en Cofres'});
  return L.sort((a,b)=>a.at-b.at).slice(0,25)}
function hostPush(){pushT=null;if(!host)return;lastPush=now();try{const s=JSON.parse(JSON.stringify(S));s.notifs=s.notifs.slice(0,20);host.set({save:s,avisos:avisosList(),at:S.savedAt})}catch(e){}}
function save(force){const t=now();if(!force&&t-lastSave<3000)return;lastSave=t;S.savedAt=t;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(host&&(force||dirtyHost)){dirtyHost=false;clearTimeout(pushT);pushT=setTimeout(hostPush,force?0:4000)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){dirtyHost=true;save(true)}else{catchUp();dirty=true}});
if(host){try{const h=host.get();const c=h&&h.save;if(c&&c.v===1&&(c.savedAt||0)>(S.savedAt||0)+5000){S=c;sel=null}}catch(e){}
  host.onChange(()=>{try{const h=host.get(),c=h&&h.save;if(c&&c.v===1&&(c.savedAt||0)>(S.savedAt||0)+5000){S=c;sel=null;catchUp();dirty=true}}catch(e){}});
  setInterval(()=>{if(now()-lastPush>10*60e3){dirtyHost=true;save(true)}},60e3)}

/* ---------- arranque ---------- */
resize();catchUp();render();requestAnimationFrame(draw);
setInterval(()=>{tick();if(dirty)render();else live();save()},250);
}
</script>
</body>
</html>
